sp("--la",la+"deg");sp("--ra",ra+"deg");sp("--w",w+"deg");sp("--wd",wd+"s");sp("--ex",ex+"px");sp("--ey",ey+"px");sp("--hx",(ex*.3)+"px");sp("--hy",(ey*.25)+"px");sp("--by",by+"px");sp("--ba",ba+"deg");sp("--bo",bo);sp("--bk",q.b[0]);sp("--bd",q.b[1]+"s");sp("--sk",q.b[2]?"shd":"none");sp("--ek",q.k?q.k[0]:"none");sp("--ekd",q.k?q.k[1]+"s":"3s");
MXE.querySelectorAll(".pp").forEach(p=>p.classList.toggle("on",p.classList.contains("pp-"+j)))}
const route=t=>{t=t.toLowerCase();return /mail|email/.test(t)?"mail":/search|find|look up/.test(t)?"search":/book|ticket|movie|website/.test(t)?"browse":/code|build|script|app/.test(t)?"code":/pay|checkout/.test(t)?"pay":/shop|cart|order|buy/.test(t)?"shop":/remind|calendar|schedule|meet/.test(t)?"calendar":/remember|save/.test(t)?"memory":/chart|data|sheet|spend/.test(t)?"data":/draw|image|design|invite/.test(t)?"create":/slack|message|text/.test(t)?"message":/file|doc|read|pdf/.test(t)?"files":/^(hi|hello|hey)/.test(t)?"wave":"think"};
const insp=()=>{const s=S[cur],n=s.i||0;return`<h3>Live activity</h3>${card(cur)||`<div class="row" style="--t:${s.c}"><div class="ico">${ic(s.ic)}</div><div class="grow"><b>${s.n}</b><small>${s.say}</small></div></div>`}<h3>Steps</h3>${STEPS.map((x,j)=>`<div class="stp ${j+1<n?"done":j+1==n?"on":""}" style="--t:${s.c}">${j+1==n?s.st:x}</div>`).join("")}<h3>While you were away</h3><div class="tl">${LG.map(a=>`<div style="--t:${T(a[0])}">${a[2]}<small>${a[1]} am</small></div>`).join("")}</div>`};
const scrollEnd=()=>{const e=$("scr");setTimeout(()=>e.scrollTo({top:e.scrollHeight,behavior:"smooth"}),80)};
const SC={chat:()=>`<div class="thr"><div class="dv">Today</div>${LOG.map(([r,t])=>`<div class="m ${r}">${t}</div>`).join("")}<div class="m a" id="amsg"></div><div class="inl" id="cardw"></div></div>`,
tasks:()=>{const R=[["browse","Book movie night","Selecting seats",55],["mail","Chaperone sign-up","Needs your OK",90],["code","Expense tracker","Building",40]],A=[["files","7:42","Filled the field trip slip"],["mail","7:50","Drafted a note to Ms. Rivera"],["browse","8:10","Tickets opened, I tracked them"],["pay","8:12","Held the cart, waiting on you"]];
return`<h1 class="h">Tasks</h1><p class="sub">Blip is running 3 things</p>`+R.map(r=>`<div class="row" style="--t:${T(r[0])}"><div class="ico">${ic(S[r[0]].ic)}</div><div class="grow"><b>${r[1]}</b><small>${r[2]}</small><div class="pr"><i style="width:${r[3]}%"></i></div></div></div>`).join("")+`<div class="lab">While you were away</div><div class="tl">`+A.map(a=>`<div style="--t:${T(a[0])}">${a[2]}<small>${a[1]} am</small></div>`).join("")+`</div>`},
docs:()=>{const D=[["files","Field trip slip","PDF"],["code","Expense tracker","Sheet"],["browse","Movie night plan","Doc"],["mail","Teacher email","Draft"]];
return`<h1 class="h">Docs</h1><p class="sub">Things I made for you</p><div class="docs">`+D.map(d=>`<div class="dc" style="--t:${T(d[0])}"><div class="th"><b></b><b></b><b></b></div>${d[1]}<small>${d[2]}</small></div>`).join("")+`</div>`},
ideas:()=>{const I2=[["Felix's birthday is in 9 days. Want invites drafted?","mail"],["Your Link card expires next month. Update it?","pay"],["Tickets get cheaper after 6pm. Want me to wait?","browse"]];
return`<h1 class="h">Ideas</h1><p class="sub">Things I noticed</p>`+I2.map(i=>`<div class="row idea" style="--t:${T(i[1])}"><div class="top2"><div class="ico">${ic(S[i[1]].ic)}</div><p>${i[0]}</p></div><div class="pair"><button onclick="this.closest('.idea').remove()">Not now</button><button class="go" onclick="this.closest('.idea').remove()">Do it</button></div></div>`).join("")},
tools:()=>{const L=[["Email","mail","Drafts freely, asks before sending",1],["Calendar","files","Adds events on its own",1],["Browser","browse","Runs in its own secure VM",1],["Wallet","pay","Asks you every single time",1,1],["Terminal","code","Sandboxed, no outside access",0]];
return`<h1 class="h">Tools</h1><p class="sub">What I can touch</p>`+L.map(t=>`<div class="row" style="--t:${T(t[1])}"><div class="ico">${ic(S[t[1]].ic)}</div><div class="grow"><b>${t[0]}</b><small>${t[2]}</small></div><label class="tgl"><input type="checkbox" ${t[3]?"checked":""} ${t[4]?"disabled":""} aria-label="${t[0]}"><i></i></label></div>`).join("")}};
const lst=q=>TH.map((t,i)=>[t,i]).filter(([t])=>t[0].toLowerCase().includes((q||"").toLowerCase())).map(([t,i])=>`<button class="th2" style="--c:${T(t[1])}" ${i==th&&tab=="chat"?'aria-current="true"':""} onclick="pick(${i})"><i></i><span>${t[0]}<small>${S[t[1]].ask?"Waiting for you":S[t[1]].st||"Idle"}</small></span>${S[t[1]].ask?"<em>Needs you</em>":""}</button>`).join("");
const sideHTML=()=>`<div class="sh"><b class="logo">Blip</b><button class="ib" aria-label="New chat" onclick="newChat()">${ic("plus")}</button></div><input class="srch" placeholder="Search chats" aria-label="Search chats" oninput="$('tl2').innerHTML=lst(this.value)"><div class="dl">Chats</div><div id="tl2">${lst()}</div><div class="dl">Preview every state</div><div class="chips">${Object.keys(S).map(k=>`<button class="chip" data-k="${k}" style="--c:${T(k)}" aria-pressed="${k==cur&&tab=="chat"}" onclick="st('${k}')"><i></i>${S[k].n}</button>`).join("")}</div><div class="sf"><button class="sm" data-keep onclick="auto=!auto;this.textContent='Auto-cycle: '+(auto?'on':'off')">Auto-cycle: ${auto?"on":"off"}</button><button class="sm" onclick="D.dataset.theme=D.dataset.theme=='dark'?'light':'dark'">Light or dark</button></div>`;
function upd(){const s=S[cur];D.style.setProperty("--t",s.c);t0=Date.now();vi=0;$("mt").innerHTML=s.i?ic(s.ic)+s.n:"";$("mt").style.display=s.i?"inline-flex":"none";$("cap").style.setProperty("--p",s.i?(s.i-.5)*25+"%":"0%");pose(cur);
document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",tab=="chat"&&c.dataset.k==cur));$("insp").innerHTML=insp();
if(tab=="chat"){$("amsg").textContent=s.say;$("cardw").innerHTML=card(cur);scrollEnd()}tick()}
function render(){$("scr").innerHTML=tab=="chat"?SC.chat():`<div class="pgw">${SC[tab]()}</div>`;
const nav=TABS.map(t=>`<button role="tab" aria-selected="${t[0]==tab}" onclick="go('${t[0]}')">${ic(t[1])}<span>${t[2]}</span></button>`).join("");$("dock").innerHTML=nav;$("rail").innerHTML=nav;
$("cmp").style.display=tab=="chat"?"flex":"none";$("side").innerHTML=sideHTML();upd()}
const go=t=>{tab=t;side(0);render()},side=o=>$("app").classList.toggle("dr",!!o);
function pick(i){th=i;cur=TH[i][1];LOG=[["u",TH[i][2]]];auto=0;tab="chat";side(0);render()}
function newChat(){TH.unshift(["New chat","wave","Hi Blip!"]);pick(0)}
function st(k){auto=0;cur=k;side(0);if(tab!="chat"){tab="chat";render()}else upd()}
function peek(){const h=$("hd");h.classList.toggle("big");clearTimeout(pk);if(h.classList.contains("big"))pk=setTimeout(()=>h.classList.remove("big"),5000)}
function send(){const v=$("inp").value.trim();if(!v)return;$("inp").value="";$("cmp").classList.remove("has");auto=0;LOG.push(["a",S[cur].say],["u",v]);if(tab!="chat")tab="chat";cur="think";render();setTimeout(()=>{cur=route(v);upd()},1100)}
function ok(){auto=0;cur="success";S.success.say="Sent. I will remind you Thursday to pack a lunch.";upd();setTimeout(()=>{if(cur=="success"){cur="idle";upd()}},4200)}
function tick(){const s=S[cur],e=Math.floor((Date.now()-t0)/1000);$("verb").textContent=s.v[vi%s.v.length];$("clk").textContent=s.i?Math.floor(e/60)+":"+String(e%60).padStart(2,"0"):""}
document.querySelectorAll("[data-i]").forEach(b=>b.innerHTML=ic(b.dataset.i));
const dd=document.createElement("div");dd.innerHTML=MXSVG;MXE=dd.firstElementChild;$("mxw").appendChild(MXE);
$("inp").addEventListener("keydown",e=>{if(e.key=="Enter")send()});$("inp").addEventListener("input",e=>$("cmp").classList.toggle("has",!!e.target.value.trim()));
addEventListener("pointerdown",e=>{if(!e.target.closest("[data-keep]"))auto=0});
let pq=0;addEventListener("pointermove",e=>{if(pq)return;pq=requestAnimationFrame(()=>{pq=0;const r=MXE.getBoundingClientRect(),c=(v,a,b)=>Math.max(-1,Math.min(1,(v-a)/b*2));MXE.style.setProperty("--px",c(e.clientX,r.left+r.width/2,innerWidth)*2.6+"px");MXE.style.setProperty("--py",c(e.clientY,r.top+r.height/2,innerHeight)*2.2+"px")})});
setInterval(tick,1000);setInterval(()=>{vi++;tick()},2200);
const ks=Object.keys(S);let n=1;setInterval(()=>{if(auto&&tab=="chat"){cur=ks[n%ks.length];n++;upd()}},4800);
setInterval(()=>{if(cur!="idle"||tab!="chat")return;const x=["wink","twitch","hip"][Math.random()*3|0];MXE.classList.add(x);setTimeout(()=>MXE.classList.remove(x),1000)},5200);
LOG=[["u",TH[0][2]]];render();
</script></body></html>
