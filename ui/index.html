<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Blip · Federation</title>
<link rel="stylesheet" href="blip-rig.css" />
<style>
@property --t { syntax: "<color>"; inherits: true; initial-value: #FFD66B; }
@property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
:root {
  --t: #FFD66B; --p: 0;
  --bg: #0E0916; --s1: #171024; --s2: #1F1731; --s3: #2B2142;
  --ln: rgba(255,255,255,.09); --ink: #F5F0FF; --mu: #9C91B8;
  --glass: rgba(31,23,49,.72);
  --f: ui-rounded, "SF Pro Rounded", Nunito, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spring: cubic-bezier(.3,1.5,.5,1);
  --pfill: color-mix(in srgb, var(--t) calc(var(--p) * 1%), transparent);
}
:root[data-theme="light"] {
  --bg: #F3EFFA; --s1: #FFFFFF; --s2: #F6F2FC; --s3: #E9E2F5;
  --ln: rgba(27,20,38,.1); --ink: #1B1426; --mu: #6E6580;
  --glass: rgba(255,255,255,.8);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3EFFA; --s1: #FFFFFF; --s2: #F6F2FC; --s3: #E9E2F5;
    --ln: rgba(27,20,38,.1); --ink: #1B1426; --mu: #6E6580;
    --glass: rgba(255,255,255,.8);
  }
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f);
  display: flex; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }

/* ---------- sidebar ---------- */
.sidebar {
  width: 300px; min-width: 300px; height: 100dvh;
  border-right: 1px solid var(--ln); background: linear-gradient(180deg, var(--s1), var(--bg));
  display: flex; flex-direction: column; padding: 18px 16px; gap: 14px; overflow-y: auto;
  z-index: 70;
}
.sidebar::-webkit-scrollbar { width: 8px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 8px; }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 4px 4px; }
.brand-orb {
  width: 36px; height: 36px; border-radius: 12px; flex: none;
  background: radial-gradient(circle at 32% 30%, #FFF3C4, var(--t) 55%, #C88415);
  box-shadow: 0 0 20px color-mix(in srgb, var(--t) 40%, transparent);
}
.brand b { font-size: 17px; font-weight: 800; letter-spacing: -.01em; display: block; }
.brand small { font-family: var(--mono); font-size: 9px; letter-spacing: .24em; color: var(--mu); }
.newchat {
  border: 1px solid var(--ln); background: var(--s2); border-radius: 16px;
  padding: 12px 14px; font-weight: 700; font-size: 14px; text-align: left;
  transition: all .25s var(--spring); display: flex; align-items: center; gap: 10px;
}
.newchat:hover { border-color: color-mix(in srgb, var(--t) 45%, var(--ln)); transform: translateY(-1px); }
.newchat i { width: 10px; height: 10px; border-radius: 4px; background: var(--t); }
.section-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: .26em; color: var(--mu);
  padding: 6px 6px 0; font-weight: 500;
}
.chat-row {
  display: flex; gap: 10px; align-items: center; padding: 12px 13px; border-radius: 16px;
  border: 1px solid var(--ln); background: var(--s2); text-align: left; width: 100%;
  transition: all .28s var(--spring);
}
.chat-row[aria-current="true"] {
  border-color: var(--t); background: color-mix(in srgb, var(--t) 10%, var(--s1));
}
.chat-row i { width: 9px; height: 9px; border-radius: 4px; background: var(--t); flex: none; }
.chat-row b { display: block; font-size: 13.5px; line-height: 1.2; }
.chat-row small { color: var(--mu); font-size: 11.5px; font-family: var(--mono); }
.card { border: 1px solid var(--ln); background: var(--s2); border-radius: 18px; padding: 12px 13px; }
.card .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; }
.card .row span { color: var(--mu); }
.card .row b { font-family: var(--mono); font-size: 11.5px; font-weight: 500; }
.dotc { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--mu); vertical-align: middle; }
.dotc.on { background: #5FD8A6; box-shadow: 0 0 8px #5FD8A6; }
.dotc.err { background: #FF6B81; }
.lane { display: flex; gap: 6px; }
.lane button {
  flex: 1; border: 1px solid var(--ln); border-radius: 12px; padding: 8px 0;
  font-family: var(--mono); font-size: 10.5px; color: var(--mu); transition: all .2s var(--spring);
}
.lane button.active { border-color: var(--t); color: var(--ink); background: color-mix(in srgb, var(--t) 12%, transparent); }
.keyin {
  width: 100%; border: 1px solid var(--ln); border-radius: 12px; background: var(--bg);
  color: var(--ink); padding: 10px; font-family: var(--mono); font-size: 11.5px; outline: none; margin-top: 8px;
}
.setbtn { width: 100%; margin-top: 7px; border-radius: 12px; background: var(--t); color: #1B1426; font-weight: 800; padding: 9px 0; font-size: 12.5px; }
.note { font-size: 11.5px; color: var(--mu); line-height: 1.5; padding: 0 4px; }
.sidebar .spacer { flex: 1; min-height: 8px; }

/* ---------- main ---------- */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; height: 100dvh; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; gap: 10px;
}
.session { font-family: var(--mono); font-size: 11.5px; color: var(--mu); letter-spacing: .05em; }
.session b { color: var(--ink); font-weight: 700; }
#menuBtn { display: none; }

.stage { position: relative; text-align: center; padding: 0 16px 14px; flex: none; overflow: hidden; }
.stage::before {
  content: ""; position: absolute; left: 50%; top: -140px; width: min(700px, 120vw); height: 460px;
  transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--t) 28%, transparent), transparent 72%);
  transition: background .8s ease;
}
#peek { position: relative; width: 230px; height: 168px; margin: 0 auto; overflow: hidden; }
#peek svg { width: 230px; height: auto; display: block; margin-top: -6px; }
.verbline {
  position: relative; font-size: clamp(22px, 4vw, 32px); font-weight: 800;
  letter-spacing: -.03em; line-height: 1.05; margin-top: -4px;
}
.tagrow { position: relative; display: flex; justify-content: center; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
.tagchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px;
  background: color-mix(in srgb, var(--t) 15%, transparent);
  font-family: var(--mono); font-size: 11px; font-weight: 600;
}
.tagchip.ghost { background: transparent; border: 1px solid var(--ln); color: var(--mu); }
.tagchip i { width: 8px; height: 8px; border-radius: 3px; background: var(--t); }
.steps { position: relative; display: flex; gap: 5px; justify-content: center; margin-top: 12px; }
.steps span { width: 40px; height: 4px; border-radius: 99px; background: var(--s3); position: relative; overflow: hidden; }
.steps span.on { background: color-mix(in srgb, var(--t) 35%, var(--s3)); }
.steps span.cur::after {
  content: ""; position: absolute; inset: 0; width: calc(var(--p) * 1%);
  background: var(--t); border-radius: 99px;
}

.thread {
  flex: 1; overflow-y: auto; padding: 8px clamp(16px, 4vw, 40px) 110px;
  display: flex; flex-direction: column; gap: 12px;
}
.thread::-webkit-scrollbar { width: 10px; }
.thread::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 8px; }
.bubble {
  max-width: 640px; padding: 13px 17px; border-radius: 22px; font-size: 15px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word; animation: popin .4s var(--spring);
  border: 1px solid var(--ln);
}
@keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.bubble.user { align-self: flex-end; background: var(--ink); color: var(--bg); border: none; border-bottom-right-radius: 8px; }
.bubble.agent { align-self: flex-start; background: var(--s2); border-bottom-left-radius: 8px; }
.bubble.sys { align-self: center; background: none; border: none; color: var(--mu); font-family: var(--mono); font-size: 12px; }
.empty { margin: auto; text-align: center; color: var(--mu); font-family: var(--mono); letter-spacing: .34em; font-size: 12px; padding-bottom: 30px; }
.empty b { display: block; font-size: 20px; letter-spacing: .5em; color: var(--ink); font-weight: 800; margin-bottom: 10px; }

.dock {
  position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding: 0 clamp(16px, 4vw, 40px); z-index: 40; pointer-events: none;
}
.composer {
  max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
  border: 1px solid var(--ln); border-radius: 22px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.3);
  padding: 11px 11px 11px 16px; pointer-events: auto;
  box-shadow: 0 18px 50px -18px rgba(0,0,0,.5);
  transition: border-color .2s ease, box-shadow .2s ease;
}
:root[data-theme="light"] .composer { box-shadow: 0 18px 50px -18px rgba(27,20,38,.18); }
.composer:focus-within {
  border-color: color-mix(in srgb, var(--t) 55%, var(--ln));
  box-shadow: 0 18px 50px -18px color-mix(in srgb, var(--t) 40%, transparent);
}
.composer textarea {
  flex: 1; background: none; border: none; resize: none; outline: none; color: var(--ink);
  font: 15px/1.4 var(--f); max-height: 130px;
}
.composer textarea::placeholder { color: var(--mu); }
.send {
  border-radius: 14px; padding: 10px 18px; font-weight: 800; font-size: 12.5px;
  background: var(--t); color: #1B1426; transition: transform .15s ease, opacity .2s;
}
.send:hover { transform: translateY(-1px); }
.send:disabled { opacity: .4; cursor: not-allowed; transform: none; }

@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-105%); transition: transform .45s var(--spring);
  }
  .sidebar.open { transform: none; }
  #menuBtn { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-orb"></div>
      <div><b>Blip</b><small>FEDERATION</small></div>
    </div>

    <button class="newchat"><i></i>New chat</button>

    <div class="section-label">CHATS</div>
    <button class="chat-row" aria-current="true">
      <i></i>
      <span><b>Main thread</b><small id="chatStatus">ready</small></span>
    </button>

    <div class="section-label">UPLINK</div>
    <div class="card">
      <div class="row"><span>Brain</span><b><span class="dotc" id="dBrain"></span><span id="brainT">check</span></b></div>
      <div class="row"><span>Transport</span><b id="transport">rest</b></div>
      <div class="row"><span>Decider</span><b id="decT">jev lane</b></div>
    </div>

    <div class="section-label">LANE</div>
    <div class="lane">
      <button id="tPrimary" class="active">PRIMARY</button>
      <button id="tCheap">CHEAP</button>
    </div>

    <div class="section-label">APPEARANCE</div>
    <div class="lane">
      <button id="thDark" class="active">DARK</button>
      <button id="thLight">LIGHT</button>
    </div>

    <div class="section-label">AUTH KEY</div>
    <div class="card" style="display:block">
      <input class="keyin" id="key" type="password" placeholder="agent api key" autocomplete="off" spellcheck="false" />
      <button class="setbtn" id="setKey">SAVE KEY</button>
    </div>

    <div class="spacer"></div>
    <p class="note">Key stays in this browser. Blip picks its pose with a fast-lane model after every exchange.</p>
  </aside>

  <main>
    <div class="topbar">
      <button class="pill" id="menuBtn" style="border:1px solid var(--ln);background:var(--s2);border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--mu)">Menu</button>
      <div class="session"><b>blip</b> / main thread</div>
      <div style="width:60px"></div>
    </div>

    <section class="stage">
      <div id="peek"><div id="blipMount"></div></div>
      <div class="verbline" id="verb">Ready when you are</div>
      <div class="tagrow">
        <span class="tagchip"><i></i><span id="toolTag">idle</span></span>
        <span class="tagchip ghost"><span id="clock">0:00</span></span>
      </div>
      <div class="steps" id="steps"><span class="on"></span><span class="cur"></span><span></span><span></span></div>
    </section>

    <div class="thread" id="thread">
      <div class="empty" id="empty"><b>BLIP</b>tapped into federation</div>
    </div>

    <div class="dock">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Blip..."></textarea>
        <button class="send" id="send">SEND</button>
      </div>
    </div>
  </main>

<script type="module">
import { attachBlip, ST } from "./blip-rig.js";

const AGENT = "https://agent-federation.agent-federation.workers.dev";
const $ = (id) => document.getElementById(id);

const svgText = await fetch("blip-rig.svg").then((r) => r.text());
$("blipMount").innerHTML = svgText;
const blip = attachBlip($("blipMount"));

/* mobile sidebar */
$("menuBtn").onclick = () => $("sidebar").classList.toggle("open");

let verbTimer = null;
const STEP_STATES = { think: 1, search: 1, browse: 1, read: 1, code: 2, mail: 2, pay: 3, approve: 3, success: 3, error: 3 };
function setHeadline(stateKey, verbOverride) {
  const s = ST[stateKey] || ST.idle;
  blip.set(stateKey);
  $("toolTag").textContent = s.n.toLowerCase();
  $("chatStatus").textContent = s.h;
  const verbs = verbOverride ? [verbOverride, s.t, s.h] : [s.t, s.h, s.n];
  let vi = 0;
  $("verb").textContent = verbs[0];
  clearInterval(verbTimer);
  verbTimer = setInterval(() => { vi = (vi + 1) % verbs.length; $("verb").textContent = verbs[vi]; }, 2400);
  const step = STEP_STATES[stateKey] ?? (stateKey === "idle" ? 0 : 1);
  $("steps").querySelectorAll("span").forEach((sp, i) => {
    sp.className = i < step ? "on" : i === step ? "cur" : "";
  });
}

let t0 = Date.now(), progTimer = null;
function startProgress() {
  t0 = Date.now();
  document.documentElement.style.setProperty("--p", 6);
  clearInterval(progTimer);
  progTimer = setInterval(() => {
    const el = Math.floor((Date.now() - t0) / 1000);
    $("clock").textContent = Math.floor(el / 60) + ":" + String(el % 60).padStart(2, "0");
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--p")) || 0;
    if (cur < 92) document.documentElement.style.setProperty("--p", Math.min(92, cur + 4));
  }, 650);
}
function stopProgress() {
  clearInterval(progTimer);
  document.documentElement.style.setProperty("--p", 0);
  $("clock").textContent = "0:00";
}

const paramTheme = new URLSearchParams(location.search).get("theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem("blip_theme", t);
  $("thDark").classList.toggle("active", t === "dark");
  $("thLight").classList.toggle("active", t === "light");
}
applyTheme(paramTheme === "light" || paramTheme === "dark" ? paramTheme : localStorage.getItem("blip_theme") || "dark");
$("thDark").onclick = () => applyTheme("dark");
$("thLight").onclick = () => applyTheme("light");

const key = () => (localStorage.getItem("blip_key") || "").trim();
if (key()) $("key").value = key();
$("setKey").onclick = () => {
  const v = $("key").value.trim();
  localStorage.setItem("blip_key", v);
  sys(v ? "key saved · " + v.slice(0, 6) + "…" : "key cleared");
  check();
};

let tier = "primary";
$("tPrimary").onclick = () => { tier = "primary"; $("tPrimary").classList.add("active"); $("tCheap").classList.remove("active"); };
$("tCheap").onclick = () => { tier = "cheap"; $("tCheap").classList.add("active"); $("tPrimary").classList.remove("active"); };

async function check() {
  try {
    const r = await fetch(AGENT + "/health");
    const j = await r.json();
    $("dBrain").className = "dotc " + (j.ok ? "on" : "err");
    $("brainT").textContent = j.ok ? "online" : "degraded";
  } catch {
    $("dBrain").className = "dotc err";
    $("brainT").textContent = "down";
  }
}
check(); setInterval(check, 30000);

const thread = $("thread");
function bubble(role, text) {
  $("empty").style.display = "none";
  const d = document.createElement("div");
  d.className = "bubble " + role;
  d.textContent = text;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  return d;
}
function sys(t) { bubble("sys", t); }

let ws = null, busy = false;
function connectWS() {
  try {
    ws = new WebSocket(AGENT.replace("https://", "wss://") + "/");
    ws.onopen = () => { $("transport").textContent = "websocket"; };
    ws.onclose = () => { $("transport").textContent = "rest"; setTimeout(connectWS, 5000); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === "chat" && typeof m.reply === "string") finish(m.reply);
        else if (m.error) finish("[error] " + m.error);
      } catch {}
    };
  } catch { $("transport").textContent = "rest"; }
}
connectWS();

async function decide(userText, replyText) {
  try {
    const r = await fetch(AGENT + "/api/decide", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + key() },
      body: JSON.stringify({ context: "User: " + userText.slice(0, 300) + "\nBlip: " + replyText.slice(0, 300) }),
    });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  if (!key()) { sys("save your agent api key in the sidebar first"); return; }
  $("input").value = ""; $("input").style.height = "auto";
  bubble("user", text);
  busy = true; $("send").disabled = true;
  setHeadline("think");
  startProgress();

  let replied = false;
  const finish = async (reply) => {
    if (replied) return; replied = true;
    bubble("agent", reply);
    const d = await decide(text, reply);
    if (d && ST[d.state]) {
      setHeadline(d.state, d.verb);
      $("decT").textContent = d.state + " · " + (d.verb || "");
    } else {
      setHeadline("idle");
      $("decT").textContent = "fallback idle";
    }
    stopProgress();
    busy = false; $("send").disabled = false;
  };

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "chat", content: text, tier }));
  }
  try {
    const r = await fetch(AGENT + "/api/message", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + key() },
      body: JSON.stringify({ content: text, tier }),
    });
    const j = await r.json();
    finish(j.reply || "[error] " + (j.error || JSON.stringify(j)));
  } catch (e) {
    finish("[network] " + String(e));
  }
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", () => {
  $("input").style.height = "auto";
  $("input").style.height = Math.min($("input").scrollHeight, 130) + "px";
});
setHeadline("idle");
</script>
</body>
</html>
