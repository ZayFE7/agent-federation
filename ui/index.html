<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Blip · Federation</title>
<link rel="stylesheet" href="blip-rig.css" />
<style>
@property --t { syntax: "<color>"; inherits: true; initial-value: #FFD66B; }
@property --p { syntax: "<number>"; inherits: true; initial-value: 0; }
:root {
  --t: #FFD66B;
  --p: 0;
  --bg: #0E0916; --s1: #171024; --s2: #1F1731; --s3: #2B2142;
  --ln: rgba(255,255,255,.09); --ink: #F5F0FF; --mu: #9C91B8;
  --f: ui-rounded, "SF Pro Rounded", Nunito, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spring: cubic-bezier(.3,1.5,.5,1);
  --pfill: color-mix(in srgb, var(--t) calc(var(--p) * 1%), transparent);
}
:root[data-theme="light"] {
  --bg: #F3EFFA; --s1: #FFFFFF; --s2: #F6F2FC; --s3: #E9E2F5;
  --ln: rgba(27,20,38,.1); --ink: #1B1426; --mu: #6E6580;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F3EFFA; --s1: #FFFFFF; --s2: #F6F2FC; --s3: #E9E2F5;
    --ln: rgba(27,20,38,.1); --ink: #1B1426; --mu: #6E6580;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(900px 500px at 80% -10%, color-mix(in srgb, var(--t) 7%, transparent), transparent 60%),
    var(--bg);
  color: var(--ink); font: 15px/1.45 var(--f);
  display: flex; overflow: hidden;
  transition: --t .7s ease;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--t); outline-offset: 2px; }

/* rail */
.rail {
  width: 76px; border-right: 1px solid var(--ln); background: var(--s1);
  display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 8px;
}
.rail .logo {
  width: 42px; height: 42px; border-radius: 14px; margin-bottom: 14px;
  background: radial-gradient(circle at 32% 30%, #FFF3C4, var(--t) 55%, #C88415);
  box-shadow: 0 0 22px color-mix(in srgb, var(--t) 45%, transparent);
  transition: box-shadow .5s ease;
}
.tab {
  width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center;
  color: var(--mu); transition: all .25s var(--spring); position: relative;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); transform: translateY(-2px); }
.tab:hover { color: var(--ink); }
.tab small { display: none; }
.rail .spacer { flex: 1; }

/* chats column */
.chats {
  width: 300px; min-width: 300px; border-right: 1px solid var(--ln);
  background: linear-gradient(180deg, var(--s1), var(--bg));
  display: flex; flex-direction: column; padding: 18px 14px; gap: 10px;
}
.chats h1 { font-size: 20px; letter-spacing: -.02em; margin: 4px 6px 10px; font-weight: 800; }
.chat-row {
  display: flex; gap: 10px; align-items: center; padding: 12px 13px; border-radius: 18px;
  border: 1px solid var(--ln); background: var(--s2); text-align: left; width: 100%;
  transition: all .3s var(--spring);
}
.chat-row[aria-current="true"] { border-color: var(--t); background: color-mix(in srgb, var(--t) 10%, var(--s1)); transform: translateX(3px); }
.chat-row i { width: 10px; height: 10px; border-radius: 4px; background: var(--t); flex: none; }
.chat-row b { display: block; font-size: 14px; line-height: 1.2; }
.chat-row small { color: var(--mu); font-size: 12px; font-family: var(--mono); }

/* main */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

.stage {
  position: relative; padding: 10px 0 0; text-align: center; overflow: hidden;
  border: none; border-radius: 0;
  border-bottom: 1px solid var(--ln); background: linear-gradient(180deg, var(--s1), transparent);
}
.stage::before {
  content: ""; position: absolute; left: 50%; top: -60px; width: 480px; height: 320px;
  transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--t) 22%, transparent), transparent);
}
#peek {
  position: relative; width: 128px; height: 104px; margin: 0 auto; overflow: hidden;
  cursor: pointer; transition: width .55s var(--spring), height .55s var(--spring);
}
#peek.full { width: 230px; height: 170px; }
#peek .blip-mount { width: 230px; display: block; margin: 0 auto; }
#peek svg { width: 230px; height: auto; display: block; margin-top: -14px; transform: translateX(-14px); }
.capsule {
  position: relative; margin: -4px auto 0; width: min(520px, calc(100% - 36px));
  border-radius: 99px; border: 1px solid var(--ln); background: var(--s2);
  display: flex; align-items: center; gap: 10px; padding: 9px 16px; overflow: hidden;
  z-index: 2;
}
.capsule::before {
  content: ""; position: absolute; inset: 0; width: calc(var(--p) * 1%);
  background: var(--pfill); transition: width .5s ease; pointer-events: none;
}
.capsule .cdot { width: 9px; height: 9px; border-radius: 50%; background: var(--t); animation: pulse 1.8s ease-in-out infinite; flex: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--t) 55%, transparent);} 50% { box-shadow: 0 0 0 7px transparent; } }
.capsule .verb { font-weight: 700; font-size: 13.5px; flex: 1; text-align: left; position: relative; }
.capsule .tagp {
  font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 99px;
  background: color-mix(in srgb, var(--t) 18%, transparent); position: relative;
}
.capsule .clock { font-family: var(--mono); font-size: 12px; color: var(--mu); position: relative; min-width: 38px; text-align: right; }

/* thread */
.thread {
  flex: 1; overflow-y: auto; padding: 22px clamp(16px, 4vw, 40px) 8px;
  display: flex; flex-direction: column; gap: 12px;
}
.thread::-webkit-scrollbar { width: 10px; }
.thread::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 8px; }
.bubble {
  max-width: 640px; padding: 12px 16px; border-radius: 22px; font-size: 15px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; animation: popin .35s var(--spring);
  border: 1px solid var(--ln);
}
@keyframes popin { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.bubble.user { align-self: flex-end; background: var(--ink); color: var(--bg); border: none; border-bottom-right-radius: 8px; }
.bubble.agent { align-self: flex-start; background: var(--s2); border-bottom-left-radius: 8px; }
.bubble.sys { align-self: center; background: transparent; color: var(--mu); font-family: var(--mono); font-size: 12px; border: none; }
.empty {
  margin: auto; text-align: center; color: var(--mu); font-family: var(--mono);
  letter-spacing: .3em; font-size: 12px;
}
.empty b { display: block; font-size: 22px; letter-spacing: .45em; margin-bottom: 10px; color: var(--ink); font-weight: 800; }

/* composer */
.composer-wrap { padding: 10px clamp(16px, 4vw, 40px) calc(18px + env(safe-area-inset-bottom, 0px)); }
.composer {
  max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
  border: 1px solid var(--ln); border-radius: 22px; background: var(--s2);
  padding: 12px 14px; transition: border-color .2s ease, box-shadow .2s ease;
}
.composer:focus-within { border-color: color-mix(in srgb, var(--t) 50%, var(--ln)); box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--t) 40%, transparent); }
.composer textarea {
  flex: 1; background: none; border: none; resize: none; outline: none; color: var(--ink);
  font: 15px/1.45 var(--f); max-height: 160px;
}
.composer textarea::placeholder { color: var(--mu); }
.send {
  border-radius: 14px; padding: 10px 18px; font-weight: 800; font-size: 13px;
  background: var(--t); color: #1B1426; transition: transform .15s ease, opacity .2s;
}
.send:hover { transform: translateY(-1px); }
.send:disabled { opacity: .4; cursor: not-allowed; transform: none; }

/* side panel (settings) */
.side {
  width: 300px; border-left: 1px solid var(--ln); background: var(--s1);
  padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
}
.side h2 { font-size: 12px; font-family: var(--mono); letter-spacing: .22em; color: var(--mu); font-weight: 500; margin: 6px 0 2px; }
.card { border: 1px solid var(--ln); background: var(--s2); border-radius: 22px; padding: 14px; }
.card .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; }
.card .row span { color: var(--mu); }
.card .row b { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.dot7 { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--mu); }
.dot7.on { background: #5FD8A6; box-shadow: 0 0 8px #5FD8A6; }
.dot7.err { background: #FF6B81; }
.lane { display: flex; gap: 6px; }
.lane button {
  flex: 1; border: 1px solid var(--ln); border-radius: 12px; padding: 8px 0;
  font-family: var(--mono); font-size: 11px; color: var(--mu); transition: all .2s var(--spring);
}
.lane button.active { border-color: var(--t); color: var(--ink); background: color-mix(in srgb, var(--t) 12%, transparent); }
.keyin {
  width: 100%; border: 1px solid var(--ln); border-radius: 12px; background: var(--bg);
  color: var(--ink); padding: 10px; font-family: var(--mono); font-size: 12px; outline: none;
}
.setbtn { width: 100%; margin-top: 8px; border-radius: 12px; background: var(--t); color: #1B1426; font-weight: 700; padding: 9px 0; font-size: 13px; }
.note { font-size: 12px; color: var(--mu); line-height: 1.5; }

@media (max-width: 1100px) { .side { display: none; } }
@media (max-width: 860px) {
  .rail { display: none; }
  .chats { display: none; }
}
</style>
</head>
<body>
  <nav class="rail" role="tablist" aria-label="Sections">
    <div class="logo" title="Blip"></div>
    <button class="tab" role="tab" aria-selected="true" title="Chat">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v10H8l-4 4z"/></svg>
    </button>
    <button class="tab" role="tab" aria-selected="false" title="Tasks (soon)" disabled>
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
    </button>
    <button class="tab" role="tab" aria-selected="false" title="Docs (soon)" disabled>
      <svg viewBox="0 0 24 24"><path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4"/></svg>
    </button>
    <div class="spacer"></div>
    <button class="tab" id="clearTab" role="tab" aria-selected="false" title="Clear thread">
      <svg viewBox="0 0 24 24"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12"/></svg>
    </button>
  </nav>

  <aside class="chats">
    <h1>Chats</h1>
    <button class="chat-row" aria-current="true">
      <i></i>
      <span><b>Main thread</b><small id="chatStatus">idle</small></span>
    </button>
    <div class="note" style="margin-top:auto;padding:8px 6px;">blip v1 · federation</div>
  </aside>

  <main>
    <div class="stage">
      <div id="peek" title="Tap to peek"><div class="blip-mount" id="blipMount"></div></div>
      <div class="capsule">
        <span class="cdot"></span>
        <span class="verb" id="verb">Ready</span>
        <span class="tagp" id="toolTag">idle</span>
        <span class="clock" id="clock">0:00</span>
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="empty" id="empty"><b>BLIP</b>tapped into federation</div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Blip..."></textarea>
        <button class="send" id="send">SEND</button>
      </div>
    </div>
  </main>

  <aside class="side">
    <h2>UPLINK</h2>
    <div class="card">
      <div class="row"><span>Brain</span><b><span class="dot7" id="dBrain"></span><span id="brainT">check</span></b></div>
      <div class="row"><span>Transport</span><b id="transport">REST</b></div>
      <div class="row"><span>Decider</span><b><span class="dot7" id="dDec"></span><span id="decT">jev lane</span></b></div>
    </div>
    <h2>LANE</h2>
    <div class="lane">
      <button id="tPrimary" class="active">PRIMARY</button>
      <button id="tCheap">CHEAP</button>
    </div>
    <h2>AUTH KEY</h2>
    <div class="card" style="display:block">
      <input class="keyin" id="key" type="password" placeholder="agent api key" autocomplete="off" />
      <button class="setbtn" id="setKey">SAVE KEY</button>
    </div>
    <h2>APPEARANCE</h2>
    <div class="lane">
      <button id="thDark" class="active">DARK</button>
      <button id="thLight">LIGHT</button>
    </div>
    <p class="note">Blip reads your last exchange and a fast lane model picks the pose and color you see above. Key stays in this browser only.</p>
  </aside>

<script type="module">
import { attachBlip, ST } from "./blip-rig.js";

const AGENT = "https://agent-federation.agent-federation.workers.dev";
const $ = (id) => document.getElementById(id);

/* ---- mascot ---- */
const svgText = await fetch("blip-rig.svg").then((r) => r.text());
$("blipMount").innerHTML = svgText;
const blip = attachBlip($("blipMount"));
$("peek").onclick = () => {
  const p = $("peek");
  p.classList.toggle("full");
  if (p.classList.contains("full")) setTimeout(() => p.classList.remove("full"), 5000);
};

/* ---- capsule ---- */
let verbTimer = null;
function setHeadline(stateKey, verbOverride) {
  const s = ST[stateKey] || ST.idle;
  blip.set(stateKey);
  $("toolTag").textContent = stateKey;
  $("chatStatus").textContent = s.h;
  const verbs = (verbOverride ? [verbOverride, s.t] : [s.t, s.h, s.n]);
  let vi = 0;
  $("verb").textContent = verbs[0];
  clearInterval(verbTimer);
  verbTimer = setInterval(() => { vi = (vi + 1) % verbs.length; $("verb").textContent = verbs[vi]; }, 2200);
}

/* progress + clock */
let t0 = Date.now(), progTimer = null;
function startProgress() {
  t0 = Date.now();
  document.documentElement.style.setProperty("--p", 8);
  clearInterval(progTimer);
  progTimer = setInterval(() => {
    const el = Math.floor((Date.now() - t0) / 1000);
    $("clock").textContent = Math.floor(el / 60) + ":" + String(el % 60).padStart(2, "0");
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--p")) || 0;
    if (cur < 92) document.documentElement.style.setProperty("--p", Math.min(92, cur + 3));
  }, 700);
}
function endProgress(stateKey) {
  clearInterval(progTimer);
  document.documentElement.style.setProperty("--p", 100);
  $("clock").textContent = "done";
  setTimeout(() => document.documentElement.style.setProperty("--p", 0), 900);
  setHeadline(stateKey || "idle");
}

/* ---- auth ---- */
const key = () => localStorage.getItem("blip_key") || "";

/* ---- theme ---- */
const paramTheme = new URLSearchParams(location.search).get("theme");
const savedTheme = localStorage.getItem("blip_theme");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem("blip_theme", t);
  $("thDark").classList.toggle("active", t === "dark");
  $("thLight").classList.toggle("active", t === "light");
}
applyTheme(paramTheme === "light" || paramTheme === "dark" ? paramTheme : savedTheme || "dark");
$("thDark").onclick = () => applyTheme("dark");
$("thLight").onclick = () => applyTheme("light");
if (key()) $("key").value = key();
$("setKey").onclick = () => { localStorage.setItem("blip_key", $("key").value.trim()); check(); sys("key saved locally"); };

let tier = "primary";
$("tPrimary").onclick = () => { tier = "primary"; $("tPrimary").classList.add("active"); $("tCheap").classList.remove("active"); };
$("tCheap").onclick = () => { tier = "cheap"; $("tCheap").classList.add("active"); $("tPrimary").classList.remove("active"); };

async function check() {
  try {
    const r = await fetch(AGENT + "/health");
    const j = await r.json();
    $("dBrain").className = "dot7 " + (j.ok ? "on" : "err");
    $("brainT").textContent = j.ok ? "online" : "degraded";
  } catch {
    $("dBrain").className = "dot7 err";
    $("brainT").textContent = "down";
  }
}
check(); setInterval(check, 30000);

/* ---- thread ---- */
const thread = $("thread");
function bubble(role, text) {
  $("empty").style.display = "none";
  const d = document.createElement("div");
  d.className = "bubble " + role;
  d.textContent = text;
  thread.appendChild(d);
  thread.scrollTop = thread.scrollHeight;
  return d;
}
function sys(t) { bubble("sys", t); }
$("clearTab").onclick = () => { thread.querySelectorAll(".bubble").forEach((n) => n.remove()); $("empty").style.display = ""; };

/* ---- transport ---- */
let ws = null, busy = false;
function connectWS() {
  try {
    ws = new WebSocket(AGENT.replace("https://", "wss://") + "/");
    ws.onopen = () => { $("transport").textContent = "websocket"; };
    ws.onclose = () => { $("transport").textContent = "rest"; setTimeout(connectWS, 5000); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === "chat" && typeof m.reply === "string") done(m.reply);
        else if (m.error) done("[error] " + m.error);
      } catch {}
    };
  } catch { $("transport").textContent = "rest"; }
}
connectWS();

/* ---- the Jev tip: fast model decides mascot state ---- */
async function decide(userText, replyText) {
  try {
    const r = await fetch(AGENT + "/api/decide", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + key() },
      body: JSON.stringify({ context: "User: " + userText.slice(0, 300) + "\nBlip: " + replyText.slice(0, 300) }),
    });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function send() {
  const text = $("input").value.trim();
  if (!text || busy) return;
  if (!key()) { sys("save your agent api key in the panel first"); return; }
  $("input").value = ""; $("input").style.height = "auto";
  bubble("user", text);
  busy = true; $("send").disabled = true;
  setHeadline("think");
  startProgress();

  let replied = false;
  const finish = async (reply) => {
    if (replied) return; replied = true;
    bubble("agent", reply);
    const d = await decide(text, reply);
    $("dDec").className = "dot7 " + (d ? "on" : "err");
    if (d && ST[d.state]) {
      setHeadline(d.state, d.verb);
      $("dDec").className = "dot7 on";
      $("decT").textContent = d.state + " · " + d.verb;
    } else {
      endProgress("idle");
      $("decT").textContent = "fallback idle";
    }
    document.documentElement.style.setProperty("--p", 0);
    $("clock").textContent = "0:00";
    busy = false; $("send").disabled = false;
  };

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "chat", content: text, tier }));
  }
  try {
    const r = await fetch(AGENT + "/api/message", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + key() },
      body: JSON.stringify({ content: text, tier }),
    });
    const j = await r.json();
    finish(j.reply || "[error] " + (j.error || JSON.stringify(j)));
  } catch (e) {
    finish("[network] " + String(e));
  }
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", () => {
  $("input").style.height = "auto";
  $("input").style.height = Math.min($("input").scrollHeight, 160) + "px";
});
setHeadline("idle");
</script>
</body>
</html>
