:root{
  --t:#FFD66B;--bt:#FFD66B;
  --bg:#F2F0F9;--s1:#fff;--s2:#F8F7FC;--s3:#E9E6F4;--s4:#EFEBF7;
  --ln:rgba(36,27,58,.09);--ln2:rgba(36,27,58,.16);
  --ink:#241B3A;--mu:#756C8C;--mt:#675E7F;
  --er:#A3243F;--ok:#1F7A55;--gm:#241B3A;--gp:45%;
  --amb:#2B2008;--lnk:#2C5FD0;
  --soft:rgba(255,214,107,.20);--dsoft:rgba(163,36,63,.07);--osoft:rgba(31,122,85,.09);
  --sh1:0 1px 2px rgba(36,27,58,.04),0 10px 24px -18px rgba(36,27,58,.28);
  --sh2:0 4px 10px rgba(36,27,58,.06),0 30px 60px -24px rgba(36,27,58,.32);
  --f:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --side:280px;--insp:320px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120D1D;--s1:#1B1429;--s2:#1A1327;--s3:#2C2145;--s4:#221936;
    --ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.16);
    --ink:#F5F0FF;--mu:#A196BD;--mt:#B6ABCE;
    --er:#FF9DAC;--ok:#5FD8A6;--gm:#fff;--gp:72%;
    --amb:#241B3A;--lnk:#9DBBFF;
    --soft:rgba(255,214,107,.12);--dsoft:rgba(255,107,129,.10);--osoft:rgba(95,216,166,.10);
    --sh1:0 1px 0 rgba(255,255,255,.03),0 10px 24px -18px rgba(0,0,0,.8);
    --sh2:0 4px 10px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120D1D;--s1:#1B1429;--s2:#1A1327;--s3:#2C2145;--s4:#221936;
  --ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.16);
  --ink:#F5F0FF;--mu:#A196BD;--mt:#B6ABCE;
  --er:#FF9DAC;--ok:#5FD8A6;--gm:#fff;--gp:72%;
  --amb:#241B3A;--lnk:#9DBBFF;
  --soft:rgba(255,214,107,.12);--dsoft:rgba(255,107,129,.10);--osoft:rgba(95,216,166,.10);
  --sh1:0 1px 0 rgba(255,255,255,.03),0 10px 24px -18px rgba(0,0,0,.8);
  --sh2:0 4px 10px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;width:100%}
body{position:fixed;inset:0;width:100%;overflow:hidden;touch-action:manipulation}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
button,.btn,.snd,.att,.srow,.tch,.chip,.sug,.ib{-webkit-touch-callout:none;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{scrollbar-color:color-mix(in srgb,var(--ink) 22%,transparent) transparent}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 18%,transparent) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border:3px solid transparent;background-clip:padding-box;border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
body{margin:0;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f);font-optical-sizing:auto;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(55% 26% at 58% 0%,color-mix(in srgb,var(--t) 10%,transparent),transparent 78%)}
::selection{background:var(--t);color:var(--amb)}
a{color:var(--lnk)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;flex:none;color:var(--mt);transition:background .15s,border-color .15s,color .15s}
.ib:hover{background:var(--s2);color:var(--ink)}
.mob{display:none}

.app{position:relative;display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100dvh;min-height:0;overflow:hidden}
@media (min-width:1280px){.app{grid-template-columns:var(--side) minmax(0,1fr) var(--insp)}}

/* one sidebar */
.side{position:relative;display:flex;flex-direction:column;min-height:0;height:100%;padding:10px 10px calc(8px + env(safe-area-inset-bottom));background:var(--s2);border-right:1px solid var(--ln);z-index:20}
.sbrand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;flex:none}
.sbrand .mark{display:grid;place-items:center;flex:none;filter:drop-shadow(0 4px 8px rgba(201,143,0,.18))}
.sbrand b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sbrand .x{margin-left:auto;display:none;width:36px;height:36px;border:1px solid var(--ln);border-radius:9px;background:var(--s1);place-items:center;color:var(--mt)}
.newb{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border:0;border-radius:11px;background:var(--ink);color:var(--s1);font-size:13.5px;font-weight:700;flex:none;transition:transform .15s,filter .15s}
.newb:hover{filter:brightness(1.06)}
.newb:active{transform:scale(.985)}
.nav{display:grid;gap:2px;margin-top:8px;flex:none}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:1px solid transparent;border-radius:9px;background:none;color:var(--mt);font-size:13.5px;font-weight:600;text-align:left;transition:background .15s,color .15s,border-color .15s}
.nav button .ic{opacity:.85}
.nav button:hover{background:var(--s1);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--s1);border-color:var(--ln);color:var(--ink)}
.nav button .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--t);color:var(--amb);font:700 11px/20px var(--f);text-align:center}
.nav button .cnt[hidden]{display:none}
.clabel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 10px 6px;flex:none;font-size:12px;font-weight:700;color:var(--mt)}
.clabel .ccount{font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;height:36px;margin:0 4px;padding:0 9px;flex:none;border:1px solid var(--ln);border-radius:9px;background:var(--s1);color:var(--mu);transition:border-color .15s}
.search:focus-within{border-color:color-mix(in srgb,var(--ink) 32%,var(--ln))}
.search .ic{width:15px;height:15px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--mu)}
.search input::-webkit-search-cancel-button{opacity:.55}
.slist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 2px 8px;margin-top:2px}
.sgroup{padding:10px 8px 4px;font-size:11.5px;font-weight:700;color:var(--mu)}
.srowwrap{border:1px solid transparent;border-radius:11px;margin:1px 0}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:0 8px;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:10px;background:none;text-align:left;color:var(--ink)}
.srow:hover{background:var(--s1);border-color:var(--ln)}
.srow[aria-current="page"]{background:transparent;border-color:transparent}
.srowwrap.on{background:var(--s1);border-color:var(--ln)}
.stit{display:block;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stit .ic{width:12px;height:12px;color:var(--mu);vertical-align:-2px;margin-right:3px}
.smeta{grid-column:1;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--mt);font-variant-numeric:tabular-nums}
.unread{grid-column:2;grid-row:1/span 2;align-self:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--t);color:var(--amb);font:700 10.5px/20px var(--f);text-align:center}
.sacts{display:flex;gap:14px;padding:0 10px 8px 9px}
.sacts button{border:0;background:none;padding:3px 0;font-size:11.5px;font-weight:700;color:var(--mt)}
.sacts button:hover{color:var(--ink)}
.sacts button.danger:hover{color:var(--er)}
.sempty{padding:18px 10px;color:var(--mt);font-size:12.5px;line-height:1.5}
.sempty p{margin:0 0 10px}
.sempty .btn{width:100%}
.sres{margin-top:6px}
.srhit{display:block;width:100%;margin:5px 0;padding:8px 9px;border:1px solid var(--ln);border-radius:9px;background:var(--s1);color:inherit;text-align:left;font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.srhit:hover{border-color:var(--ln2);background:var(--s2)}
.srhit:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.srhit .srt{display:block;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srhit .srs{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:var(--mt);font-size:11.5px;line-height:1.45;overflow-wrap:anywhere}
.srhit .srm{display:block;margin-top:4px;color:var(--mu);font-size:10.5px}
.srnote{padding:7px 8px;color:var(--mt);font-size:11.5px;line-height:1.5}
.dev{margin:6px 4px 0;flex:none}
.dev summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px;color:var(--mu);font-size:11.5px;font-weight:700;cursor:pointer;list-style:none;border-radius:8px}
.dev summary .ic{width:13px;height:13px;color:var(--mu);transition:transform .2s}
.dev[open] summary .ic{transform:rotate(180deg)}
.dev summary::-webkit-details-marker{display:none}
.dev summary:hover{background:var(--s1);color:var(--ink)}
.dev .chips{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow:auto;padding:2px 4px 8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--ln);border-radius:7px;background:var(--s1);font-size:11px;font-weight:600;color:var(--mt)}
.chip i{width:6px;height:6px;border-radius:2px;background:var(--c)}
.chip:hover{border-color:var(--ln2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--s1)}
.sbot{display:flex;gap:4px;padding:8px 2px 0;margin-top:4px;border-top:1px solid var(--ln);flex:none}
.sbot button{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:none;color:var(--mt);font-size:11.5px;font-weight:700}
.sbot button:hover{background:var(--s1);color:var(--ink)}
.sbot .ic{width:15px;height:15px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(88vw,344px);transform:translateX(-105%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding-top:calc(10px + env(safe-area-inset-top));border-right:1px solid var(--ln)}
  .app.dr .side{transform:none;box-shadow:var(--sh2);z-index:60}
  .sbrand .x{display:grid}
  .nav button,.sbot button{height:44px}
  .srow{min-height:48px}
  .mob{display:grid}
}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(20,10,40,.48);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
.app.dr .scrim{opacity:1;visibility:visible;pointer-events:auto}
@media (min-width:900px){.scrim{display:none}}

/* main */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:radial-gradient(90% 55% at 100% 0%,color-mix(in srgb,var(--t) 16%,transparent) 0%,transparent 62%),radial-gradient(70% 45% at 0% 12%,color-mix(in srgb,#8B7CFF 10%,transparent) 0%,transparent 60%),var(--bg)}
.hd{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:72px;padding:calc(8px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 8px calc(20px + env(safe-area-inset-left));background:var(--bg);border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1;position:relative}
.av{position:relative;width:56px;height:56px;flex:none;cursor:pointer;transform-origin:50% 20%;transition:transform .55s cubic-bezier(.22,1,.36,1);-webkit-tap-highlight-color:transparent;z-index:2}
.av:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 24%,#fff 0,color-mix(in srgb,var(--t) 38%,var(--s1)) 82%);box-shadow:0 0 0 3px var(--s1),0 8px 18px -10px color-mix(in srgb,var(--t) 80%,#241B3A)}
.av:hover{transform:translateY(-1px)}
.avc{position:absolute;inset:0;clip-path:path("M-40 -40H96V28H56A28 28 0 0 1 0 28H-40Z")}
.avc #mx{--sine:cubic-bezier(.37,0,.63,1);position:absolute;display:block;width:96px;height:auto;left:-20px;top:-11.4px;overflow:visible;transition:--la .9s cubic-bezier(.34,1.4,.64,1),--ra .9s cubic-bezier(.34,1.4,.64,1),--w .6s ease,--ex .6s cubic-bezier(.34,1.3,.64,1),--ey .6s cubic-bezier(.34,1.3,.64,1),--by .5s ease,--ba .5s ease,--bo .4s ease,--hx .9s cubic-bezier(.34,1.3,.64,1) .08s,--hy .9s cubic-bezier(.34,1.3,.64,1) .08s,--lid .35s ease,--px .25s ease,--py .25s ease}
.who.big .av{transform:scale(2.7) translateY(10px)}
.who.big .avc{clip-path:none}
.avc .shd{display:none}.who.big .avc .shd{display:block}
.idn{display:flex;flex-direction:column;gap:2px;min-width:0;transition:opacity .25s}
.nm{margin:0;font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;font-weight:600;color:var(--mt);white-space:nowrap}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--t);flex:none}
.sdot.pulse{animation:pls 1.2s ease-in-out infinite}
.st b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.clk{font:500 11.5px/1 var(--mono);color:var(--mu);font-variant-numeric:tabular-nums}
.clk:empty{display:none}
.hdact{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;transition:opacity .25s}
.hd.big .idn,.hd.big .hdact,.hd.big .mob{opacity:0;pointer-events:none}
.model{position:relative;display:flex;align-items:center}
.model[hidden]{display:none}
.model select{appearance:none;height:32px;max-width:176px;padding:0 26px 0 10px;border:1px solid var(--ln);border-radius:9px;background:var(--s1);color:var(--mt);font-size:11.5px;font-weight:700;text-overflow:ellipsis;cursor:pointer;outline:0}
.model select:hover{border-color:var(--ln2);color:var(--ink)}
.model .ic{position:absolute;right:7px;width:13px;height:13px;color:var(--mu);pointer-events:none}
.pk{position:fixed;inset:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}
.pk.on{opacity:1;visibility:visible;pointer-events:auto}
@media (max-width:560px){
  .hd{min-height:calc(66px + env(safe-area-inset-top));padding:calc(6px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left));gap:8px}
  .av{width:52px;height:52px}
  .nm{font-size:15px}
  .st{font-size:11.5px}
  .model select{max-width:116px;padding-left:8px;font-size:10.5px}
  .hd .mob{width:36px;height:36px}
}
@media (max-width:899px){.hd .mob{display:grid}}

/* thread */
.scr{-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:calc(var(--topH,80px) + 10px) 20px calc(var(--cmpH,96px) + var(--kb,0px) + 10px);scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.thr{width:100%;max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px}
.welcome{margin:auto 0;padding:4vh 0 5vh;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.welcome .wmark{margin-bottom:16px;filter:drop-shadow(0 10px 18px rgba(201,143,0,.18))}
.welcome h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.welcome p{margin:10px 0 0;max-width:52ch;color:var(--mt);font-size:14px;line-height:1.55}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:22px}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);text-align:left;transition:border-color .15s,transform .15s}
.sug:hover{border-color:var(--ln2);transform:translateY(-1px)}
.sug .sic{width:28px;height:28px;border-radius:8px;background:var(--s2);color:var(--mt);display:grid;place-items:center;margin-bottom:5px}
.sug .sic .ic{width:15px;height:15px}
.sug b{font-size:13.5px;font-weight:700}
.sug small{color:var(--mt);font-size:12px;line-height:1.4}
.sug code{margin-top:4px;color:var(--mu);font:11px/1.5 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.whint{margin-top:16px;color:var(--mu);font-size:11.5px}
.whint code{font:11px var(--mono);padding:1px 5px;border-radius:5px;background:var(--s3);color:var(--ink)}
.m{padding:10px 14px;border-radius:17px;max-width:min(86%,560px);min-width:0;overflow-wrap:break-word;font-size:15.5px;line-height:1.52;border:1px solid transparent}

.nt{transform-box:fill-box;transform-origin:center;animation:tuck 2.8s var(--sine) infinite}.bel{opacity:0;animation:belly 2.8s var(--sine) infinite}
.spk{transform-box:fill-box;transform-origin:center;animation:spark 2s var(--sine) infinite}.s2{animation-delay:1s}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 1s var(--sine) infinite}
.hg{transform-box:fill-box;transform-origin:center;animation:flip 4s var(--sine) infinite}.sn1,.sn2{transform-box:fill-box;transform-origin:50% 100%;animation:sand 4s linear infinite}.sn2{animation-name:sand2}
.mb{animation:mini 1.8s var(--sine) infinite}.brs{transform-box:fill-box;transform-origin:0 100%;animation:brush 1.6s var(--sine) infinite}
.fp{transform-box:fill-box;transform-origin:top;animation:fpg 3.2s var(--sine) infinite}.hlc{transform-box:fill-box;transform-origin:center;animation:pls2 1.4s var(--sine) infinite}
[data-s=listen] .ear{animation:perk 1.6s var(--sine) infinite;transform:rotate(calc(var(--ed)*-8deg))}
.wink .eR{animation:wk .5s var(--sine)}.twitch .ear{animation:flick .7s var(--sine)}.hip .sq{animation:hop .9s var(--sine)}
@keyframes chg{0%{transform:scale(1)}30%{transform:scale(1.06,.93)}60%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes grow{0%{transform:scaleY(0)}55%,100%{transform:scaleY(1)}}
@keyframes pop2{0%,8%{transform:scale(0)}22%,78%{transform:scale(1)}92%,100%{transform:scale(0)}}
@keyframes fall{0%{transform:translateY(-36px);opacity:0}20%{opacity:1}50%,85%{transform:none;opacity:1}100%{transform:none;opacity:0}}
@keyframes tuck{0%{transform:scale(1);opacity:0}12%{opacity:1}65%{transform:translate(-55px,113px) scale(.28);opacity:1}80%,100%{transform:translate(-55px,113px) scale(0);opacity:0}}
@keyframes belly{0%,60%{opacity:0}75%{opacity:.75}100%{opacity:0}}
@keyframes spark{0%,100%{transform:scale(0) rotate(0)}50%{transform:scale(1) rotate(90deg)}}
@keyframes wv{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes flip{0%,85%{transform:rotate(0)}100%{transform:rotate(180deg)}}
@keyframes sand{0%{transform:scaleY(1)}85%,100%{transform:scaleY(.04)}}@keyframes sand2{0%{transform:scaleY(.04)}85%,100%{transform:scaleY(1)}}
@keyframes mini{0%,100%{transform:translate(0,0)}25%{transform:translate(7px,-14px)}50%{transform:translate(14px,0)}75%{transform:translate(7px,-7px)}}
@keyframes brush{0%,100%{transform:rotate(-8deg) translate(-6px,4px)}50%{transform:rotate(8deg) translate(8px,-4px)}}
@keyframes fpg{0%,60%{transform:scaleY(1)}70%{transform:scaleY(.1)}80%,100%{transform:scaleY(1)}}
@keyframes pls2{50%{transform:scale(1.4)}}@keyframes perk{50%{transform:rotate(calc(var(--ed)*-3deg))}}
@keyframes wk{40%,60%{transform:scaleY(.08)}}@keyframes flick{30%{transform:rotate(calc(var(--ed)*14deg))}60%{transform:rotate(calc(var(--ed)*-4deg))}}

/* ============================================================
   Quiet console redesign, 2026-10-30
   One monochrome system for every window. The mascot carries
   the color; tool icons keep their brand marks. This block is
   intentionally last so it wins over the older theme layers.
   ============================================================ */
:root{
  --faint:#96918A;--warn:#A66A1F;
  --t:#171717;--bt:#171717;
  --bg:#F5F4F0;--s1:#FCFCFB;--s2:#F1EFEA;--s3:#E9E5DD;--s4:#EEEAE2;
  --ln:#E4E0D7;--ln2:#D3CDC2;
  --ink:#171717;--mu:#96918A;--mt:#6C6963;
  --er:#A6413B;--ok:#3D7A57;--gm:#171717;--gp:50%;
  --amb:#FCFCFB;--lnk:#3F6B8F;
  --soft:#EEEAE2;--dsoft:rgba(166,65,59,.08);--osoft:rgba(61,122,87,.09);
  --sh1:0 1px 2px rgba(23,23,23,.03),0 10px 24px -18px rgba(23,23,23,.25);
  --sh2:0 16px 40px -28px rgba(23,23,23,.4);
  --f:"Bricolage Grotesque",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Consolas,monospace;
  --side:276px;--insp:300px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --faint:#7C7770;--warn:#D4A55C;
    --t:#F2F0EA;--bt:#F2F0EA;
    --bg:#141414;--s1:#1D1D1C;--s2:#181817;--s3:#2A2722;--s4:#242220;
    --ln:#35322D;--ln2:#46423B;
    --ink:#F2F0EA;--mu:#7C7770;--mt:#A49F96;
    --er:#D88179;--ok:#77B58C;--gm:#F2F0EA;--gp:50%;
    --amb:#1D1D1C;--lnk:#9DBBFF;
    --soft:#282521;--dsoft:rgba(216,129,121,.12);--osoft:rgba(119,181,140,.1);
    --sh1:0 1px 0 rgba(255,255,255,.03),0 10px 24px -18px rgba(0,0,0,.8);
    --sh2:0 18px 42px -26px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --faint:#7C7770;--warn:#D4A55C;
  --t:#F2F0EA;--bt:#F2F0EA;
  --bg:#141414;--s1:#1D1D1C;--s2:#181817;--s3:#2A2722;--s4:#242220;
  --ln:#35322D;--ln2:#46423B;
  --ink:#F2F0EA;--mu:#7C7770;--mt:#A49F96;
  --er:#D88179;--ok:#77B58C;--gm:#F2F0EA;--gp:50%;
  --amb:#1D1D1C;--lnk:#9DBBFF;
  --soft:#282521;--dsoft:rgba(216,129,121,.12);--osoft:rgba(119,181,140,.1);
  --sh1:0 1px 0 rgba(255,255,255,.03),0 10px 24px -18px rgba(0,0,0,.8);
  --sh2:0 18px 42px -26px rgba(0,0,0,.8);
}
*{scrollbar-width:none!important;-ms-overflow-style:none!important}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
body{font-family:var(--f);background:var(--bg);color:var(--ink)}
body:before{background:radial-gradient(55% 28% at 58% 0%,color-mix(in srgb,var(--ink) 3.5%,transparent),transparent 72%)}
::selection{background:var(--ink);color:var(--s1)}
.ic{width:17px;height:17px;stroke-width:1.7}

/* ------------------------------------------------ sidebar ---- */
.side{background:var(--bg);border-right:1px solid var(--ln);padding:14px 12px calc(12px + env(safe-area-inset-bottom))}
.sbrand{padding:2px 4px 14px;gap:10px}
.sbrand .mark{filter:none}
.sbrand .btxt{min-width:0}
.sbrand .btxt b{display:block;font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.sbrand .btxt small{display:block;margin-top:1px;color:var(--mu);font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbrand .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--s1);color:var(--mut)}
.newb{height:42px;border:1px solid var(--ink);border-radius:12px;background:var(--ink);color:var(--s1);font-size:13px;font-weight:700}
.newb:hover{filter:none;background:color-mix(in srgb,var(--ink) 88%,var(--bg))}
.newb:active{transform:none}
.search{margin:12px 2px 10px;height:36px;border:1px solid var(--ln);border-radius:10px;background:var(--s1);color:var(--mu)}
.search:focus-within{border-color:var(--ln2)}
.search input{font-size:12.5px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search .ic{width:14px;height:14px;color:var(--faint)}
.clabel{padding:10px 6px 5px;color:var(--mu);font-size:11px;font-weight:700}
.clabel .ccount{color:var(--faint);font:600 10px var(--mono)}
.slist{padding:0 0 10px}
.sgroup{padding:10px 6px 4px;font-size:11px;font-weight:700;color:var(--mu)}
.srowwrap{margin:1px 0;border:0;border-radius:9px}
.srow{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:0 8px;padding:8px 9px;border:0;border-radius:9px;background:none;color:var(--ink)}
.srow:hover{background:var(--soft);border-color:transparent}
.srowwrap.on{background:var(--soft);border-color:transparent}
.srowwrap.on .srow{background:transparent}
.stit{font-size:12.5px;font-weight:600;line-height:1.25}
.smeta{font:10px/1.2 var(--mono);color:var(--mu)}
.unread{display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--s1);font:700 9.5px var(--mono)}
.sacts{display:flex;gap:2px;padding:0 4px 6px 10px}
.sacts button{border:0;border-radius:6px;background:transparent;color:var(--faint);font-size:10.5px;font-weight:600;padding:5px 6px}
.sacts button:hover{background:var(--soft);color:var(--ink)}
.sacts .danger:hover{color:var(--er)}
.sempty{padding:16px 10px;color:var(--mt);font-size:12px;line-height:1.5}
.sempty .btn{width:100%;margin-top:8px}
.sempty b{color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:10px;border-top:1px solid var(--ln)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 9px;border:0;border-radius:9px;background:none;color:var(--mt);text-align:left;font-size:12.5px;font-weight:600}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--ink)}
.nav button .ic{width:15px;height:15px}
.nav .cnt{margin-left:auto;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--soft);color:var(--mt);font:700 9.5px/17px var(--mono);text-align:center}

/*!
 * mascot-states.js
 * BLIP mascot: twenty agent states on one parameter model.
 * Zero dependencies. ES module with a classic-script fallback (globalThis.MascotStates).
 *
 * Renderer model. Every length is in ball radii (R). y is down on the canvas.
 *   dx, dy    ball offset from centre
 *   sx, sy    ball scale
 *   ex, ey    eye pair offset (ey is positive upwards)
 *   gap       half the distance between eye centres
 *   L         capsule length
 *   th        stroke thickness
 *   bend      arc bend in degrees (0 draws a capsule)
 *   tilt      eye rotation in degrees
 *   slant     opposite eye rotation in degrees
 *   asym      per-eye length difference
 *   roll      eye pair rotation around the ball centre, degrees

 *   spin      1 draws the system spinner instead of the ball
 *

 *   - arrivals are 200 to 300 ms with a damped overshoot (backOut)
 *   - one-shot states return to rest and hold before the loop restarts
 *   - blinks pinch; they never reach zero

const MascotStates = (() => {
  "use strict";

  const P = Math.PI;
  const TAU = P * 2;
  const DEG = P / 180;
  const BG = "#FCFCFC";
  const INK = "#000000";
  const EYE = "#FFFFFF";
  const BLINK_MIN = 0.16;
  const BLINK_LEN = 0.26;

    v = clamp01(v);
    return v * v * (3 - 2 * v);
  };
  const easeOut3 = (v) => {
    v = clamp01(v);
    const a = 1 - v;
    return 1 - a * a * a;
  };
  const easeInOut3 = (v) => {
    v = clamp01(v);
    return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2;
  };
  /* Damped overshoot arrival: leaves fast, lands at exactly 1 with one small overshoot. */
  const backOut = (v, k) => {
    v = clamp01(v);
    const c = k + 1;
    const a = v - 1;
    return 1 + c * a * a * a + k * a * a;
  };

  /* A gravity hop: parabolic, returns 0 outside its window. */
  const hopAt = (t, a, d, h) => {
    const u = (t - a) / d;
    return u > 0 && u < 1 ? -4 * h * u * (1 - u) : 0;
  };

  const impact = (t, land, amp) => {
    const u = (t - land) / 0.17;
    if (u < 0 || u > 1) return 0;
    return u < 0.18
      ? amp * Math.sin((P * 0.5 * u) / 0.18)
      : amp * Math.cos((P * 0.5 * (u - 0.18)) / 0.82);

    for (let i = 0; i < list.length; i++) {
      const dt = t - list[i];
      if (dt >= 0 && dt <= BLINK_LEN) {

let SEARCH={q:"",rows:null,failed:false,loading:false,timer:0,seq:0};

el.hidden=false;el.innerHTML=q.map((item,i)=>`<div class="qitem"><span class="qi">${ic("clock")}Queued</span><b title="${esc(item.text)}">${esc(item.text)}</b><button type="button" onclick="dropQueued(${i})" aria-label="Remove queued message" title="Remove">${ic("close")}</button></div>`).join("")}

function plainForSpeech(text){return String(text||"").replace(/```[\s\S]*?```/g," ").replace(/`([^`]*)`/g,"$1").replace(/!\[[^\]]*\]\([^)]*\)/g," ").replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/^#{1,6}\s+/gm,"").replace(/[*_>#|]/g," ").replace(/\s+/g," ").trim()}
function splitSpeech(text){const sentences=String(text).match(/[^.!?]+[.!?]*/g)||[String(text)];const chunks=[];let cur="";for(const s of sentences){if((cur+" "+s).trim().length>3500){if(cur.trim())chunks.push(cur.trim());cur=s}else cur+=" "+s;if(chunks.length>=7)break}if(cur.trim())chunks.push(cur.trim());return chunks.slice(0,8)}
async function speakLog(i){const text=plainForSpeech(LOG[i]?.[1]||"");if(!text){toast("There is nothing to read.");return}SPEECH_SEQ++;const seq=SPEECH_SEQ;if(currentAudio){try{currentAudio.pause()}catch(e){}currentAudio=null}const chunks=splitSpeech(text);if(!chunks.length)return;toast("Reading the reply aloud.");for(const chunk of chunks){if(seq!==SPEECH_SEQ)return;await speakChunk(chunk)}}

async function decide(approve){if(!PENDING)return;const toolCallId=PENDING.toolCallId,cmd=PENDING.cmd,toolName=PENDING.name||"exec",sid=state.sessionId;
const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000),started=Date.now();
const tick=setInterval(()=>{const el=LIVE&&LIVE.gate&&LIVE.gate.querySelector(".gwaitmsg");if(el)el.textContent=(approve?"Sending your approval":"Sending your decision")+", "+Math.round((Date.now()-started)/1000)+"s"},500);
try{const r=await api("/api/approve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sessionId:sid,toolCallId,approved:approve}),signal:ctl.signal});
const j=await r.json().catch(()=>({}));
if(!r.ok){if(state.sessionId!==sid)return;gateError(j.error||("The agent did not answer ("+r.status+")."),approve,true);return}
if(!j.ok&&!j.state){if(state.sessionId!==sid)return;gateError(j.error||"The agent could not record your decision.",approve,true);return}
if(j.state==="not_waiting"){if(state.sessionId!==sid)return;gateError(j.error||j.reply||"That approval is no longer waiting.",approve,false);return}
PENDING=null;if(!approve)LOG.push(["g",{cmd}]);
if(j.state==="queued"&&j.streamId){if(state.sessionId!==sid)return;resolveGate(approve,cmd,approve?"Approved. Blip is continuing below.":"Denied. Blip is continuing below.");beginLive(sid);LIVE.operationId=j.operationId||null;saveLive();connectStream(j.streamId);announce(approve?"Approved. Watching the turn.":"Denied. Watching the turn.");return}
if(state.sessionId!==sid)return;
if(j.output!==undefined&&j.output!==null)LOG.push(["t",{name:toolName,cmd,output:String(j.output),ok:j.ok!==false}]);
if(j.reply)LOG.push(["a",String(j.reply),Date.now()]);
PREVIEW=false;teardown();clearLive();busy=false;cur=(j.state&&S[j.state])?j.state:(approve?"success":"idle");renderThread();upd();scrollEnd(true);
announce(approve?"Approved.":"Denied.");if(!j.ok)toast("The decision was recorded. Blip stopped, but the result is in the chat.");
loadTasks();refreshSessionsSoon();
// Re-read the transcript and any next parked call. A decided approval can end a
// step with another gate behind it; stopping here is what made the loop look dead.
setTimeout(()=>{if(state.sessionId===sid&&!busy)openSession(sid)},700);
setTimeout(()=>{if(state.sessionId===sid&&!busy&&!PENDING)loadPending(sid)},2000)
}catch(e){if(state.sessionId!==sid)return;const slow=e&&e.name==="AbortError";gateError(slow?"The agent did not answer in time. Reload this chat to see where the turn got to.":"Could not send the decision. "+e,approve,!slow)}
finally{clearTimeout(to);clearInterval(tick);DECIDING=false;setSend()}}

const controls=`<div class="facts gacts"><button class="btn" onclick="goalControl('${esc(g.id)}','${Number(g.paused)===1?"resume":"pause"}')">${ic(Number(g.paused)===1?"right":"stop")}${Number(g.paused)===1?"Resume":"Pause"}</button>${g.status==="blocked"?`<button class="btn" onclick="goalControl('${esc(g.id)}','retry')">${ic("reload")}Retry step</button>`:""}<button class="btn" onclick="goalInstruct('${esc(g.id)}')">${ic("chat")}Add instruction</button>${g.status!=="done"&&g.status!=="cancelled"?`<button class="btn danger" onclick="goalCancel('${esc(g.id)}')">${ic("stop")}Cancel goal</button>`:""}</div>`;

function goalCreateDialog(){if(!hasKey()){openKeyDialog();return}const d=$("dlg");if(d.open)d.close();d.className="autodlg";const hasChat=!!state.sessionId;d.innerHTML=`<form class="dlg autoform" novalidate><h2>New goal</h2><p>Write the outcome and the evidence that proves it. The goal gets a separate chat and plans its own steps.</p><div class="gtpl"><span>Start from a template</span><button type="button" class="btn" onclick="goalTemplate('inbox')">Clean email</button><button type="button" class="btn" onclick="goalTemplate('research')">Research brief</button><button type="button" class="btn" onclick="goalTemplate('tidy')">Tidy workspace</button></div><label class="fl">Title<input id="gTitle" type="text" maxlength="120" placeholder="Clean promotional email" autocomplete="off"></label><label class="fl">Brief<textarea id="gBrief" rows="6" placeholder="What needs to happen, and any constraints the worker must know. It has not seen this chat." spellcheck="false"></textarea></label><label class="fl">Success criteria<textarea id="gCriteria" rows="4" placeholder="What must be true at the end. Name the files, outputs, or checks that prove it." spellcheck="false"></textarea></label><label class="chk"><input type="checkbox" id="gCopy" ${hasChat?"checked":"disabled"}><span>Copy this chat's files into the goal workspace${hasChat?"":" (no chat selected)"}</span></label><div class="err" id="gErr" hidden></div><div class="dacts"><button type="button" class="btn" id="gNo">Cancel</button><button type="submit" class="btn p">Create goal</button></div></form>`;

async function startComposioConnect(toolkit){if(COMPOSIOBUSY){toast("Wait for the current connector to finish.");return}COMPOSIOBUSY=toolkit;const preTab=window.open("about:blank","_blank");try{const r=await api("/api/connections/composio/"+encodeURIComponent(toolkit)+"/start",{method:"POST"});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok||!j.authUrl){if(preTab)preTab.close();toast(j.error||"Could not start that connection.");return}let target;try{target=new URL(j.authUrl)}catch(e){if(preTab)preTab.close();toast("The agent returned an invalid connect link.");return}if(target.protocol!=="https:"||target.hostname!=="connect.composio.dev"){if(preTab)preTab.close();toast("The agent returned an unexpected connect link.");return}if(preTab)preTab.location.href=target.href;else window.open(target.href,"_blank","noopener");toast("Finish the connection in the new tab. This page updates automatically.");startConnPoll();setTimeout(loadComposioConnectors,4000);setTimeout(loadComposioConnectors,12000)}catch(e){if(preTab)preTab.close();toast("Could not reach the agent to start that connection.")}finally{COMPOSIOBUSY="";if(tab==="connections")renderConnections(true)}}

async function startGoogleAuth(email){if(state.googleBusy){toast("Wait for the current Google action to finish.");return}const comp=state.googleStatus&&state.googleStatus.provider==="composio";const preTab=comp?window.open("about:blank","_blank"):null;state.googleBusy="start";try{const q=email?"?login_hint="+encodeURIComponent(email):"";const r=await api("/api/connections/google/start"+q);const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok||!j.authUrl){if(preTab)preTab.close();toast(r.status===409?"Google OAuth credentials are not configured yet.":(j.error||"Could not start Google sign-in."));if(r.status===409)await loadGoogleStatus();return}let target;try{target=new URL(j.authUrl)}catch(e){if(preTab)preTab.close();toast("The agent returned an invalid Google URL.");return}const allowed=target.hostname==="accounts.google.com"||target.hostname==="connect.composio.dev";if(target.protocol!=="https:"||!allowed){if(preTab)preTab.close();toast("The agent returned an unexpected Google URL.");return}if(target.hostname==="connect.composio.dev"){if(preTab)preTab.location.href=target.href;else window.open(target.href,"_blank","noopener");toast("Finish the Gmail connection in the new tab. This page updates automatically.");startConnPoll();setTimeout(()=>loadGoogleAccounts(),4000);setTimeout(()=>loadGoogleAccounts(),12000);return}if(preTab)preTab.close();location.href=target.href}catch(e){if(preTab)preTab.close();toast("Could not reach the agent to start Google sign-in.")}finally{state.googleBusy=""}}
async function setGoogleDefault(id){const a=state.googleAccounts.find(x=>x.id===id);if(!a){toast("That account is no longer loaded. Refresh and try again.");return}if(state.googleBusy){toast("Wait for the current Google action to finish.");return}state.googleBusy="default";try{const r=await api("/api/connections/google/default",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({id})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){toast(j.error||(r.status===404?"That account no longer exists.":"Could not set the default account."));if(r.status===404)await loadGoogleAccounts();return}await Promise.all([loadGoogleStatus(),loadGoogleAccounts()]);toast(`${a.email} is now the default.`)}catch(e){toast("Could not set the default account.")}finally{state.googleBusy=""}}
async function disconnectGoogle(id,email){const a=state.googleAccounts.find(x=>x.id===id)||{email:email};const label=a.email||"this account";const answer=await confirmDialog({title:"Disconnect Gmail?",body:`${label} will be removed from BLIP and its stored refresh token deleted. Mail in Gmail is not changed.`,confirm:"Disconnect",danger:true});if(!answer.ok)return;if(state.googleBusy){toast("Wait for the current Google action to finish.");return}state.googleBusy="delete";try{const r=await api("/api/connections/google/accounts/"+encodeURIComponent(id),{method:"DELETE"});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){toast(j.error||(r.status===404?"That account was already removed.":"Could not disconnect the account."));if(r.status===404)await loadGoogleAccounts();return}await Promise.all([loadGoogleStatus(),loadGoogleAccounts()]);toast(`${label} disconnected.`)}catch(e){toast("Could not disconnect the account.")}finally{state.googleBusy=""}}

function skillDialog(){const d=$("dlg");if(d.open)d.close();d.innerHTML=`<form class="dlg" novalidate><h2>Add skill</h2><p>Paste a SKILL.md, import a GitHub repository or subfolder, or choose a package file. Packages keep every file and folder.</p><label class="fl">GitHub or zip URL<input id="sUrl" type="text" placeholder="https://github.com/owner/repo/tree/main/skills/name" autocomplete="off" spellcheck="false"></label><label class="fl">SKILL.md<textarea id="sBody" rows="8" spellcheck="false" placeholder="---\nname: my-skill\ndescription: What this skill does\n---\n\nInstructions..."></textarea></label><label class="fl">Or choose a .md or .zip file<input id="sFile" type="file" accept=".md,.zip,text/markdown,application/zip"></label><div class="err" id="sErr" hidden></div><div class="dacts"><button type="button" class="btn" id="sNo">Cancel</button><button type="submit" class="btn p">Add skill</button></div></form>`;
const form=d.querySelector("form"),err=$("sErr");let done=false,archive=null;const fin=()=>{if(done)return;done=true;if(d.open)d.close()};$("sNo").onclick=fin;d.oncancel=e=>{e.preventDefault();fin()};d.onclose=()=>{done=true};
$("sFile").onchange=()=>{const f=$("sFile").files&&$("sFile").files[0];if(!f)return;const reader=new FileReader();if(/\.zip$/i.test(f.name)){reader.onload=()=>{const raw=String(reader.result||"");archive=raw.indexOf(",")>=0?raw.slice(raw.indexOf(",")+1):"";$("sBody").value="";$("sBody").placeholder="Zip selected: "+f.name};reader.readAsDataURL(f)}else{archive=null;reader.onload=()=>{$("sBody").value=String(reader.result||"")};reader.readAsText(f)}};
form.onsubmit=async e=>{e.preventDefault();const url=$("sUrl").value.trim(),text=$("sBody").value;if(!url&&!archive&&!text.trim()){err.hidden=false;err.textContent="Paste a SKILL.md, enter an import URL, or choose a zip.";return}err.hidden=true;try{const endpoint=(url||archive)?"/api/skills/import":"/api/skills";const body=url?{url}:archive?{archiveBase64:archive}:{text};const r=await api(endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){err.hidden=false;err.textContent=j.error||("Could not add the skill ("+r.status+").");return}fin();await loadSkills();if(tab==="settings")renderPage();const skipped=j.skipped&&j.skipped.length?` ${j.skipped.length} skipped: ${j.skipped[0].reason}`:"";toast(j.skills?`Imported ${j.skills.length} skill${j.skills.length===1?"":"s"}.${skipped}`:"Skill added.")}catch(ex){err.hidden=false;err.textContent="Could not reach the agent."}};
d.showModal();requestAnimationFrame(()=>{try{$("sUrl").focus()}catch(e){}})}
async function viewSkill(name){try{const r=await api("/api/skills/"+encodeURIComponent(name));const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){toast(j.error||"Could not read the skill.");return}const d=$("dlg");if(d.open)d.close();const list=j.skill.files||[];const total=list.reduce((n,f)=>n+(Number(f.bytes)||0),0);const files=list.slice(0,8).map(f=>`<code>${esc(f.path)} · ${fmtB(f.bytes)}</code>`).join(" ");const more=list.length>8?`<code>+${list.length-8} more files</code>`:"";const fileBox=list.length?`<div class="mnote">${list.length} file${list.length===1?"":"s"} · ${fmtB(total)}${j.skill.source?` · ${esc(srcLabel(j.skill.source))}`:""}</div><div class="mmodel">${files}${more}</div>`:"";const description=j.skill.description.length>360?j.skill.description.slice(0,360)+"...":j.skill.description;d.innerHTML=`<div class="dlg"><h2>${esc(j.skill.name)}</h2><p>${esc(description)}</p>${j.skill.source?`<p class="mnote">Source: ${esc(j.skill.source)}</p>`:""}${fileBox}<pre class="skillpre">${esc(j.skill.body)}</pre><div class="dacts"><button class="btn" id="sDl">Download .zip</button><button class="btn p" id="sClose">Close</button></div></div>`;$("sDl").onclick=()=>downloadSkill(name);$("sClose").onclick=()=>d.close();d.oncancel=e=>{e.preventDefault();d.close()};d.showModal();d.scrollTop=0}catch(e){toast("Could not read the skill.")}}
async function downloadSkill(name){try{const r=await api("/api/skills/"+encodeURIComponent(name)+"/archive");if(!r.ok){toast("Could not download the skill.");return}const u=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=u;a.download=name+".zip";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast("Could not download the skill.")}}
async function removeSkill(name){const r=await confirmDialog({title:"Remove skill?",body:`"${name}" will be removed from the skill library.`,confirm:"Remove skill",danger:true});if(!r.ok)return;try{const res=await api("/api/skills/"+encodeURIComponent(name),{method:"DELETE"});const j=await res.json().catch(()=>({}));if(!res.ok||!j.ok){toast(j.error||"Could not remove the skill.");return}await loadSkills();renderPage();toast("Skill removed.")}catch(e){toast("Could not remove the skill.")}}

const form=d.querySelector("form"),err=$("pErr");let done=false;const fin=()=>{if(done)return;done=true;if(d.open)d.close()};
$("pNo").onclick=fin;d.oncancel=e=>{e.preventDefault();fin()};d.onclose=()=>{done=true};

d.showModal();requestAnimationFrame(()=>{try{$("pName").focus()}catch(e){}})}

async function saveDefaultModel(value){let provider="deployment",model=state.pinned||state.deploymentModels[0]||"";if(value){const cut=value.indexOf("|");provider=cut<0?"deployment":value.slice(0,cut);model=cut<0?value:value.slice(cut+1)}if(!model){toast("Choose a model first.");return}try{const r=await api("/api/settings/default",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({provider,model})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){toast(j.error||"Could not save the default.");return}state.defaultProvider=provider;state.defaultModel=model;toast("Default model saved.");renderModel()}catch(e){toast("Could not save the default.")}}

/* offline: a small local copy of the last chats, plus an outbox that flushes on reconnect */
const CACHE_SESSIONS="blip.cache.sessions";
const CACHE_INDEX="blip.cache.index";
let ONLINE=navigator.onLine;
let FLUSHING=false;
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cacheGet(k){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function saveSessionsCache(){if(!state.sessions.length){clearCachedChats();return}cacheSet(CACHE_SESSIONS,{at:Date.now(),sessions:state.sessions.slice(0,60)})}
function loadSessionsCache(){const c=cacheGet(CACHE_SESSIONS);return c&&Array.isArray(c.sessions)?c.sessions:null}
function chatCacheKey(id){return "blip.cache.chat."+id}
function saveChatCache(id,messages){if(!Array.isArray(messages)||!messages.length)return;const prev=loadChatCache(id);const byId=new Map();for(const m of (prev&&Array.isArray(prev.messages)?prev.messages:[]))if(m&&m.id!=null)byId.set(m.id,m);for(const m of messages)if(m&&m.id!=null)byId.set(m.id,m);const merged=[...byId.values()].sort((a,b)=>(Number(a.created_at)||0)-(Number(b.created_at)||0)).slice(-100);cacheSet(chatCacheKey(id),{at:Date.now(),messages:merged});const idx=cacheGet(CACHE_INDEX)||[];const next=[id,...idx.filter(x=>x!==id)].slice(0,8);cacheSet(CACHE_INDEX,next);for(const old of idx)if(!next.includes(old)){try{localStorage.removeItem(chatCacheKey(old))}catch(e){}}}
function loadChatCache(id){const c=cacheGet(chatCacheKey(id));return c&&Array.isArray(c.messages)?c:null}
async function cacheSessionMessages(id){for(let attempt=0;attempt<4;attempt++){try{const r=await api("/api/sessions/"+encodeURIComponent(id)+"/messages");const j=await r.json().catch(()=>({}));if(r.ok&&j.ok&&Array.isArray(j.messages)&&j.messages.length){saveChatCache(id,j.messages);if(j.messages.some(m=>m&&m.role==="assistant"))return}}catch(e){}await new Promise(res=>setTimeout(res,600))}}
function applyMessages(id,list){LOG=[];for(const m of list||[]){const ts=Number(m.created_at)||Date.now();let tools=[];try{tools=JSON.parse(m.tools_json||"[]")}catch(e){tools=[]}if(Array.isArray(tools))for(const t of tools)if(t&&t.name)LOG.push(["t",t,ts]);let atts=null;try{atts=JSON.parse(m.attachments_json||"null")}catch(e){atts=null}let arts=null;try{arts=JSON.parse(m.artifacts_json||"null")}catch(e){arts=null}LOG.push([m.role==="user"?"u":"a",String(m.content||""),ts,Array.isArray(atts)&&atts.length?atts:null,Array.isArray(arts)&&arts.length?arts:null])}pruneQueue(id,list||[])}
function outboxKey(id){return "blip.outbox."+id}
function outboxLoad(id){const q=cacheGet(outboxKey(id));return Array.isArray(q)?q.filter(x=>x&&typeof x.text==="string"):[]}
function outboxSave(id,q){cacheSet(outboxKey(id),q);renderOutbox()}
function outboxAdd(sid,item){const q=outboxLoad(sid);q.push(item);outboxSave(sid,q)}
function outboxRemove(sid,itemId){outboxSave(sid,outboxLoad(sid).filter(x=>x.id!==itemId))}
function dropOutbox(i){const sid=state.sessionId;if(!sid)return;const q=outboxLoad(sid);if(i<0||i>=q.length)return;q.splice(i,1);outboxSave(sid,q)}
function outboxKeys(){const ids=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("blip.outbox."))ids.push(k.slice("blip.outbox.".length))}}catch(e){}return ids}
function renderOutbox(){const el=$("outBar");if(!el)return;const q=state.sessionId?outboxLoad(state.sessionId):[];if(!q.length){el.hidden=true;el.innerHTML="";return}
el.hidden=false;el.innerHTML=q.map((item,i)=>`<div class="oitem"><span class="qi">${ic("clock")}Waiting</span><b title="${esc(item.text)}">${esc(item.text)}</b><button type="button" onclick="dropOutbox(${i})" aria-label="Remove waiting message" title="Remove">${ic("close")}</button></div>`).join("")}
function measureChrome(){const hd=$("hd"),cw=$("cmpWrap"),off=$("offBar");if(!hd||!cw)return;const hdH=hd.offsetHeight;D.style.setProperty("--hdH",hdH+"px");D.style.setProperty("--topH",(hdH+((off&&!off.hidden)?off.offsetHeight:0))+"px");D.style.setProperty("--cmpH",cw.offsetHeight+"px")}
function syncViewport(){const vv=window.visualViewport;if(!vv)return;const gap=Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop));D.style.setProperty("--kb",gap>80?gap+"px":"0px")}
function updateOnlineUI(){ONLINE=navigator.onLine;const el=$("offBar");if(el){el.hidden=ONLINE;el.textContent=ONLINE?"":"Offline. Saved chats are available. Messages wait and send when you reconnect."}document.body.classList.toggle("offline",!ONLINE);if(!busy)setMascotState(!ONLINE&&cur==="idle"?"offline":cur);requestAnimationFrame(measureChrome)}
async function flushOutbox(){if(!navigator.onLine||FLUSHING)return;FLUSHING=true;let queued=false;try{
for(const sid of outboxKeys()){const items=outboxLoad(sid);for(const item of items){let r=null;try{r=await api("/api/sessions/"+encodeURIComponent(sid)+"/message",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({content:item.text,tier:"primary"})})}catch(e){return}
const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){if(r.status===400||r.status===403||r.status===409){outboxRemove(sid,item.id);continue}return}
outboxRemove(sid,item.id);if(sid===state.sessionId&&j.streamId){queueAdd(sid,{text:item.text,display:item.text,operationId:j.operationId,streamId:j.streamId,at:Date.now(),att:null,noPush:true});queued=true}}}
}finally{FLUSHING=false}
if(queued){refreshSessionsSoon();if(!busy&&!PENDING&&state.sessionId)pumpQueue(state.sessionId)}else renderOutbox()}
async function bootLoad(){try{const th=localStorage.getItem("blip.theme");if(th==="dark"||th==="light")D.dataset.theme=th}catch(e){}
syncTheme();if(!hasKey()){SESSLOAD=false;SESSFAILED=false;renderThread();render();return}
SESSLOAD=true;SESSFAILED=false;renderThread();render();await loadSessions();SESSLOAD=false;loadTasks();loadCaps();loadModelSettings();loadSkills();loadAutomations(true);loadAttention();loadGoalAttention();
const ids=state.sessions.map(s=>s.id);let stored=null;try{stored=localStorage.getItem("blip.session")}catch(e){}
const id=(stored&&ids.includes(stored))?stored:(ids.includes("main")?"main":ids[0]);
if(id&&!state.sessionId)await openSession(id);else{state.sessionId=null;try{localStorage.removeItem("blip.session")}catch(e){}LOG=[];renderThread();render()}}

addEventListener("keydown",e=>{if(e.key==="Escape"){const m=$("mascotWrap");if(m&&!m.hidden){mascotClose();return}const d=$("dlg");if(d&&d.open)return;if($("app").classList.contains("dr"))side(0)}});
matchMedia("(max-width:899px)").addEventListener("change",e=>{if(!e.matches)side(0)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{syncTheme()});
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!PENDING&&!DECIDING)send()}});
$("inp").addEventListener("input",()=>{sizeInp();setSend();saveDraft()});
addEventListener("pagehide",()=>{const L=LIVE;if(L&&L.es){L.es.onerror=null;L.es.onmessage=null;L.es.close()}});
setInterval(tick,1000);setInterval(()=>{vi++;tick()},2400);
setInterval(autoAmbientTick,10000);
updateOnlineUI();renderOutbox();measureChrome();
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true)D.classList.add("standalone");
addEventListener("online",()=>{updateOnlineUI();flushOutbox();refreshSessionsSoon()});
addEventListener("offline",updateOnlineUI);
if(window.ResizeObserver){const ro=new ResizeObserver(()=>measureChrome());["hd","cmpWrap","offBar"].forEach(id=>{const el=$(id);if(el)ro.observe(el)})}
addEventListener("resize",()=>requestAnimationFrame(measureChrome));
addEventListener("orientationchange",()=>setTimeout(measureChrome,180));
if(window.visualViewport){visualViewport.addEventListener("resize",syncViewport);visualViewport.addEventListener("scroll",syncViewport);syncViewport()}
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(()=>{})})}
sizeInp();setSend();render();bootLoad().then(consumeGoogleReturn).then(()=>{updateOnlineUI();flushOutbox();renderOutbox()});
