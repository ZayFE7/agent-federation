<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta id="themeColor" name="theme-color" content="#F2F0F9">
<title>Blip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFD66B'/%3E%3Ccircle cx='12' cy='14' r='2' fill='%23241B3A'/%3E%3Ccircle cx='20' cy='14' r='2' fill='%23241B3A'/%3E%3Cpath d='M11 20q5 4 10 0' stroke='%23241B3A' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
@property --gx{syntax:"<length>";inherits:true;initial-value:0px}
@property --gy{syntax:"<length>";inherits:true;initial-value:0px}
@property --px{syntax:"<length>";inherits:true;initial-value:0px}
@property --py{syntax:"<length>";inherits:true;initial-value:0px}
@property --hx{syntax:"<length>";inherits:true;initial-value:0px}
@property --hy{syntax:"<length>";inherits:true;initial-value:0px}
@property --lid{syntax:"<length>";inherits:true;initial-value:0px}
@property --la{syntax:"<angle>";inherits:true;initial-value:10deg}
@property --ra{syntax:"<angle>";inherits:true;initial-value:-10deg}
@property --w{syntax:"<angle>";inherits:true;initial-value:4deg}
@property --ba{syntax:"<angle>";inherits:true;initial-value:0deg}
@property --ex{syntax:"<length>";inherits:true;initial-value:0px}
@property --ey{syntax:"<length>";inherits:true;initial-value:0px}
@property --by{syntax:"<length>";inherits:true;initial-value:0px}
@property --bo{syntax:"<number>";inherits:true;initial-value:0}
@property --t{syntax:"<color>";inherits:true;initial-value:#FFD66B}

:root{
  --t:#FFD66B;--bt:#FFD66B;
  --bg:#F2F0F9;--s1:#fff;--s2:#F8F7FC;--s3:#E9E6F4;--s4:#EFEBF7;
  --ln:rgba(36,27,58,.09);--ln2:rgba(36,27,58,.16);
  --ink:#241B3A;--mu:#756C8C;--mt:#675E7F;
  --er:#A3243F;--ok:#1F7A55;--gm:#241B3A;--gp:45%;
  --amb:#2B2008;--lnk:#2C5FD0;
  --soft:rgba(255,214,107,.20);--dsoft:rgba(163,36,63,.07);--osoft:rgba(31,122,85,.09);
  --sh1:0 1px 2px rgba(36,27,58,.04),0 10px 24px -18px rgba(36,27,58,.28);
  --sh2:0 4px 10px rgba(36,27,58,.06),0 30px 60px -24px rgba(36,27,58,.32);
  --f:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --side:280px;--insp:320px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120D1D;--s1:#1B1429;--s2:#1A1327;--s3:#2C2145;--s4:#221936;
    --ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.16);
    --ink:#F5F0FF;--mu:#A196BD;--mt:#B6ABCE;
    --er:#FF9DAC;--ok:#5FD8A6;--gm:#fff;--gp:72%;
    --amb:#241B3A;--lnk:#9DBBFF;
    --soft:rgba(255,214,107,.12);--dsoft:rgba(255,107,129,.10);--osoft:rgba(95,216,166,.10);
    --sh1:0 1px 0 rgba(255,255,255,.03),0 10px 24px -18px rgba(0,0,0,.8);
    --sh2:0 4px 10px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120D1D;--s1:#1B1429;--s2:#1A1327;--s3:#2C2145;--s4:#221936;
  --ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.16);
  --ink:#F5F0FF;--mu:#A196BD;--mt:#B6ABCE;
  --er:#FF9DAC;--ok:#5FD8A6;--gm:#fff;--gp:72%;
  --amb:#241B3A;--lnk:#9DBBFF;
  --soft:rgba(255,214,107,.12);--dsoft:rgba(255,107,129,.10);--osoft:rgba(95,216,166,.10);
  --sh1:0 1px 0 rgba(255,255,255,.03),0 10px 24px -18px rgba(0,0,0,.8);
  --sh2:0 4px 10px rgba(0,0,0,.3),0 30px 60px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
html{scrollbar-color:color-mix(in srgb,var(--ink) 22%,transparent) transparent}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--ink) 18%,transparent) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink) 18%,transparent);border:3px solid transparent;background-clip:padding-box;border-radius:99px}
*::-webkit-scrollbar-track{background:transparent}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f);font-optical-sizing:auto;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(55% 26% at 58% 0%,color-mix(in srgb,var(--t) 10%,transparent),transparent 78%)}
::selection{background:var(--t);color:var(--amb)}
a{color:var(--lnk)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--s1);display:grid;place-items:center;flex:none;color:var(--mt);transition:background .15s,border-color .15s,color .15s}
.ib:hover{background:var(--s2);color:var(--ink)}
.mob{display:none}

.app{position:relative;display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100dvh;min-height:0;overflow:hidden}
@media (min-width:1280px){.app{grid-template-columns:var(--side) minmax(0,1fr) var(--insp)}}

/* one sidebar */
.side{position:relative;display:flex;flex-direction:column;min-height:0;height:100%;padding:10px 10px calc(8px + env(safe-area-inset-bottom));background:var(--s2);border-right:1px solid var(--ln);z-index:20}
.sbrand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;flex:none}
.sbrand .mark{display:grid;place-items:center;flex:none;filter:drop-shadow(0 4px 8px rgba(201,143,0,.18))}
.sbrand b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sbrand .x{margin-left:auto;display:none;width:36px;height:36px;border:1px solid var(--ln);border-radius:9px;background:var(--s1);place-items:center;color:var(--mt)}
.newb{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border:0;border-radius:11px;background:var(--ink);color:var(--s1);font-size:13.5px;font-weight:700;flex:none;transition:transform .15s,filter .15s}
.newb:hover{filter:brightness(1.06)}
.newb:active{transform:scale(.985)}
.nav{display:grid;gap:2px;margin-top:8px;flex:none}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:1px solid transparent;border-radius:9px;background:none;color:var(--mt);font-size:13.5px;font-weight:600;text-align:left;transition:background .15s,color .15s,border-color .15s}
.nav button .ic{opacity:.85}
.nav button:hover{background:var(--s1);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--s1);border-color:var(--ln);color:var(--ink)}
.nav button .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--t);color:var(--amb);font:700 11px/20px var(--f);text-align:center}
.nav button .cnt[hidden]{display:none}
.clabel{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 10px 6px;flex:none;font-size:12px;font-weight:700;color:var(--mt)}
.clabel .ccount{font-weight:600;color:var(--mu);font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;height:36px;margin:0 4px;padding:0 9px;flex:none;border:1px solid var(--ln);border-radius:9px;background:var(--s1);color:var(--mu);transition:border-color .15s}
.search:focus-within{border-color:color-mix(in srgb,var(--ink) 32%,var(--ln))}
.search .ic{width:15px;height:15px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--mu)}
.search input::-webkit-search-cancel-button{opacity:.55}
.slist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:2px 2px 8px;margin-top:2px}
.sgroup{padding:10px 8px 4px;font-size:11.5px;font-weight:700;color:var(--mu)}
.srowwrap{border:1px solid transparent;border-radius:11px;margin:1px 0}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;gap:0 8px;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:10px;background:none;text-align:left;color:var(--ink)}
.srow:hover{background:var(--s1);border-color:var(--ln)}
.srow[aria-current="page"]{background:transparent;border-color:transparent}
.srowwrap.on{background:var(--s1);border-color:var(--ln)}
.stit{display:block;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stit .ic{width:12px;height:12px;color:var(--mu);vertical-align:-2px;margin-right:3px}
.smeta{grid-column:1;margin-top:2px;font-size:11.5px;font-weight:500;color:var(--mt);font-variant-numeric:tabular-nums}
.unread{grid-column:2;grid-row:1/span 2;align-self:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--t);color:var(--amb);font:700 10.5px/20px var(--f);text-align:center}
.sacts{display:flex;gap:14px;padding:0 10px 8px 9px}
.sacts button{border:0;background:none;padding:3px 0;font-size:11.5px;font-weight:700;color:var(--mt)}
.sacts button:hover{color:var(--ink)}
.sacts button.danger:hover{color:var(--er)}
.sempty{padding:18px 10px;color:var(--mt);font-size:12.5px;line-height:1.5}
.sempty p{margin:0 0 10px}
.sempty .btn{width:100%}
.dev{margin:6px 4px 0;flex:none}
.dev summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 6px;color:var(--mu);font-size:11.5px;font-weight:700;cursor:pointer;list-style:none;border-radius:8px}
.dev summary .ic{width:13px;height:13px;color:var(--mu);transition:transform .2s}
.dev[open] summary .ic{transform:rotate(180deg)}
.dev summary::-webkit-details-marker{display:none}
.dev summary:hover{background:var(--s1);color:var(--ink)}
.dev .chips{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow:auto;padding:2px 4px 8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--ln);border-radius:7px;background:var(--s1);font-size:11px;font-weight:600;color:var(--mt)}
.chip i{width:6px;height:6px;border-radius:2px;background:var(--c)}
.chip:hover{border-color:var(--ln2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--s1)}
.sbot{display:flex;gap:4px;padding:8px 2px 0;margin-top:4px;border-top:1px solid var(--ln);flex:none}
.sbot button{flex:1;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:none;color:var(--mt);font-size:11.5px;font-weight:700}
.sbot button:hover{background:var(--s1);color:var(--ink)}
.sbot .ic{width:15px;height:15px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(88vw,344px);transform:translateX(-105%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding-top:calc(10px + env(safe-area-inset-top));border-right:1px solid var(--ln)}
  .app.dr .side{transform:none;box-shadow:var(--sh2)}
  .sbrand .x{display:grid}
  .nav button,.sbot button{height:44px}
  .srow{min-height:48px}
  .mob{display:grid}
}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(20,10,40,.48);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
.app.dr .scrim{opacity:1;visibility:visible;pointer-events:auto}
@media (min-width:900px){.scrim{display:none}}

/* main */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:var(--bg)}
.hd{position:relative;z-index:12;display:flex;align-items:center;gap:10px;flex:none;min-height:72px;padding:8px 20px;border-bottom:1px solid var(--ln);background:var(--bg)}
.who{display:flex;align-items:center;gap:10px;min-width:0;position:relative}
.av{position:relative;width:56px;height:56px;flex:none;cursor:pointer;transform-origin:50% 20%;transition:transform .55s cubic-bezier(.22,1,.36,1);-webkit-tap-highlight-color:transparent;z-index:2}
.av:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 24%,#fff 0,color-mix(in srgb,var(--t) 38%,var(--s1)) 82%);box-shadow:0 0 0 3px var(--s1),0 8px 18px -10px color-mix(in srgb,var(--t) 80%,#241B3A)}
.av:hover{transform:translateY(-1px)}
.avc{position:absolute;inset:0;clip-path:path("M-40 -40H96V28H56A28 28 0 0 1 0 28H-40Z")}
.avc #mx{--sine:cubic-bezier(.37,0,.63,1);position:absolute;display:block;width:96px;height:auto;left:-20px;top:-11.4px;overflow:visible;transition:--la .9s cubic-bezier(.34,1.4,.64,1),--ra .9s cubic-bezier(.34,1.4,.64,1),--w .6s ease,--ex .6s cubic-bezier(.34,1.3,.64,1),--ey .6s cubic-bezier(.34,1.3,.64,1),--by .5s ease,--ba .5s ease,--bo .4s ease,--hx .9s cubic-bezier(.34,1.3,.64,1) .08s,--hy .9s cubic-bezier(.34,1.3,.64,1) .08s,--lid .35s ease,--px .25s ease,--py .25s ease}
.who.big .av{transform:scale(2.7) translateY(10px)}
.who.big .avc{clip-path:none}
.avc .shd{display:none}.who.big .avc .shd{display:block}
.idn{display:flex;flex-direction:column;gap:2px;min-width:0;transition:opacity .25s}
.nm{margin:0;font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;font-weight:600;color:var(--mt);white-space:nowrap}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--t);flex:none}
.sdot.pulse{animation:pls 1.2s ease-in-out infinite}
.st b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.clk{font:500 11.5px/1 var(--mono);color:var(--mu);font-variant-numeric:tabular-nums}
.clk:empty{display:none}
.hdact{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;transition:opacity .25s}
.hd.big .idn,.hd.big .hdact,.hd.big .mob{opacity:0;pointer-events:none}
.model{position:relative;display:flex;align-items:center}
.model[hidden]{display:none}
.model select{appearance:none;height:32px;max-width:176px;padding:0 26px 0 10px;border:1px solid var(--ln);border-radius:9px;background:var(--s1);color:var(--mt);font-size:11.5px;font-weight:700;text-overflow:ellipsis;cursor:pointer;outline:0}
.model select:hover{border-color:var(--ln2);color:var(--ink)}
.model .ic{position:absolute;right:7px;width:13px;height:13px;color:var(--mu);pointer-events:none}
.pk{position:fixed;inset:0;z-index:8;background:color-mix(in srgb,var(--bg) 88%,transparent);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}
.pk.on{opacity:1;visibility:visible;pointer-events:auto}
@media (max-width:560px){
  .hd{min-height:66px;padding:6px 10px;gap:8px}
  .av{width:52px;height:52px}
  .nm{font-size:15px}
  .st{font-size:11.5px}
  .model select{max-width:116px;padding-left:8px;font-size:10.5px}
  .hd .mob{width:36px;height:36px}
}
@media (max-width:899px){.hd .mob{display:grid}}

/* thread */
.scr{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 20px 14px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.thr{width:100%;max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px}
.welcome{margin:auto 0;padding:4vh 0 5vh;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.welcome .wmark{margin-bottom:16px;filter:drop-shadow(0 10px 18px rgba(201,143,0,.18))}
.welcome h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.welcome p{margin:10px 0 0;max-width:52ch;color:var(--mt);font-size:14px;line-height:1.55}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:22px}
.sug{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:13px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--s1);text-align:left;transition:border-color .15s,transform .15s}
.sug:hover{border-color:var(--ln2);transform:translateY(-1px)}
.sug .sic{width:28px;height:28px;border-radius:8px;background:var(--s2);color:var(--mt);display:grid;place-items:center;margin-bottom:5px}
.sug .sic .ic{width:15px;height:15px}
.sug b{font-size:13.5px;font-weight:700}
.sug small{color:var(--mt);font-size:12px;line-height:1.4}
.sug code{margin-top:4px;color:var(--mu);font:11px/1.5 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.whint{margin-top:16px;color:var(--mu);font-size:11.5px}
.whint code{font:11px var(--mono);padding:1px 5px;border-radius:5px;background:var(--s3);color:var(--ink)}
.m{padding:10px 14px;border-radius:17px;max-width:min(86%,560px);min-width:0;overflow-wrap:break-word;font-size:15.5px;line-height:1.52;border:1px solid transparent}
.m.nw{animation:in .2s cubic-bezier(.22,1,.36,1) both}
.m p{margin:0}.m p+p{margin:7px 0 0}
.m h3,.m h4,.m h5,.m h6{margin:10px 0 4px;font-size:16px;font-weight:800;line-height:1.25}
.m ul,.m ol{margin:6px 0;padding-left:22px}.m li{margin:2px 0}
.m pre{margin:9px 0;padding:11px 13px;border-radius:10px;background:#1B1426;color:#F5F0FF;font:12.5px/1.55 var(--mono);white-space:pre;overflow-x:auto}
.m code{font-family:var(--mono);font-size:.88em}.m pre code{background:none;padding:0;color:inherit;font-size:12.5px}
.m :not(pre)>code{background:color-mix(in srgb,var(--t) 26%,var(--s3));padding:1px 5px;border-radius:5px}
.m a{color:var(--lnk);text-decoration:underline;text-underline-offset:2px}
.m.u{align-self:flex-end;background:var(--t);color:var(--amb);border-color:transparent;border-bottom-right-radius:5px}
.m.u code,.m.u :not(pre)>code{background:rgba(43,32,8,.14)}
.m.a{align-self:flex-start;background:var(--s1);border-color:var(--ln);border-bottom-left-radius:5px}
.m.streaming{position:relative}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.dv{display:flex;align-items:center;gap:10px;align-self:stretch;margin:16px 0 4px;font-size:11.5px;font-weight:600;color:var(--mu)}
.dv:before,.dv:after{content:"";height:1px;flex:1;background:var(--ln)}
.stoprow{display:flex;align-items:center;gap:10px;align-self:stretch;margin:12px 0;font-size:12px;font-weight:600;color:var(--mu)}
.stoprow:before,.stoprow:after{content:"";height:1px;flex:1;background:var(--ln)}
.work{display:flex;align-items:center;gap:8px;align-self:flex-start;padding:4px 2px;font-size:12px;font-weight:600;color:var(--mt)}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--t);animation:pls 1.1s ease-in-out infinite;flex:none}
.wlab{font-weight:600}
.wel{font:500 11px var(--mono);color:var(--mu)}
.ladder{display:flex;align-items:flex-end;gap:2px;height:12px;margin-left:2px}
.ladder i{display:block;width:3px;height:7px;border-radius:1px;background:var(--s3)}
.ladder i.f{background:var(--t);height:11px}
.ladder i.c{background:var(--t);height:12px;animation:pls 1s ease-in-out infinite}
.ladder[hidden]{display:none}
.err{align-self:stretch;margin:4px 0;padding:13px 15px;border:1px solid color-mix(in srgb,var(--er) 34%,var(--ln));border-radius:13px;background:var(--dsoft)}
.err b{display:block;font-size:13px;font-weight:700;color:var(--er)}
.err p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}

.emptybox{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:28px 26px;border:1px dashed var(--ln2);border-radius:14px;background:transparent}
.emptybox .eico{width:38px;height:38px;border-radius:10px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mt);margin-bottom:4px}

.emptybox p{margin:0;max-width:56ch;color:var(--mt);font-size:13px;line-height:1.55}
.emptybox .btn{margin-top:8px}
.connect{margin:auto 0;padding:4vh 0;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:38px;align-items:center;width:100%}
.connectMain{max-width:430px;min-width:0}
.cfacts{display:flex;flex-direction:column;gap:18px;padding-left:26px;border-left:1px solid var(--ln)}
.cfacts .fact{display:flex;gap:9px;align-items:flex-start}
.cfacts .facti{width:28px;height:28px;border-radius:8px;background:var(--s1);border:1px solid var(--ln);display:grid;place-items:center;color:var(--mt);flex:none}
.cfacts .facti .ic{width:14px;height:14px}
.cfacts b{display:block;font-size:12.5px;font-weight:700}
.cfacts small{display:block;margin-top:2px;color:var(--mt);font-size:11.5px;line-height:1.45}
.connect .wmark{margin-bottom:16px}
.connect h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.03em}
.connect p{margin:10px 0 0;color:var(--mt);font-size:14px;line-height:1.55}
.kfield{display:flex;gap:8px;width:100%;margin-top:22px}
.kfield input{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid var(--ln2);border-radius:10px;background:var(--s1);outline:0;font-size:14px}

@media (max-width:760px){

}
@media (max-width:560px){
  .scr{padding:12px 16px 8px}
  .welcome{padding:2vh 0 3vh}
  .welcome h1{font-size:26px}
  .sugs{grid-template-columns:1fr}
  .m{max-width:92%;font-size:15px}
}

/* tool rows */
.tcard{border:1px solid transparent;border-radius:13px;margin:2px 0;animation:in .2s cubic-bezier(.22,1,.36,1) both;max-width:min(90%,560px);min-width:0;overflow-wrap:break-word;align-self:flex-start}
.tcard.on{background:var(--s1);border-color:var(--ln)}
.tcard.on.fail{border-left:2px solid var(--er)}
.tcard .tch{display:flex;align-items:center;gap:9px;width:100%;min-height:44px;padding:6px 11px 6px 7px;border:0;border-radius:12px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.tcard:not(.on) .tch:hover{background:var(--s1)}
.tcard .tch:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ti{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--a) 20%,transparent);color:color-mix(in srgb,var(--a) var(--gp),var(--gm))}
.wic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tnm{flex:none;font-weight:700;font-size:12.5px}
.tcm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--mt);font:11.5px/1.5 var(--mono)}
.tst{flex:none;display:flex;align-items:center;gap:5px;font-weight:700;font-size:11px;color:var(--mt)}
.tst .wic{width:14px;height:14px}
.tst.ok .wic:first-child{color:var(--ok)}
.cv{color:var(--mu)}
.tcard.op .cv{transform:rotate(90deg)}
.xp{padding:2px 8px;border-radius:99px;color:var(--er);background:var(--dsoft);white-space:nowrap}
.tcard .pg{height:2px;margin:0 11px 9px;border-radius:99px;background:var(--s3);overflow:hidden}
.tcard .pg i{display:block;height:100%;border-radius:99px;background:color-mix(in srgb,var(--a) 75%,var(--ink))}
.tcard .pg.ind i{width:30%;animation:wg-pw 1.4s ease-in-out infinite alternate}
@keyframes wg-pw{to{transform:translateX(235%)}}
.tcard .tbody{display:none}.tcard.op .tbody{display:block}
.tcard .bd{padding:0 7px 7px}
.tm{border-radius:9px;background:#1B1426;color:#F5F0FF;font:11.5px/1.55 var(--mono);overflow:hidden}
.tm p{margin:0;padding:8px 11px 0;overflow-wrap:anywhere}
.tm.shell p:before{content:"$ ";opacity:.45}
.tm pre{margin:0;padding:8px 11px 10px;max-height:200px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
.gt{border:1px solid var(--ln2);border-radius:14px;background:var(--s1);overflow:hidden;margin:4px 0;max-width:min(90%,560px);min-width:0;align-self:flex-start;animation:in .2s cubic-bezier(.22,1,.36,1) both}
.gt header{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--soft);border-bottom:1px solid var(--ln)}
.gt header b{font-size:12.5px;font-weight:800;color:var(--ink)}
.gt header .ic{width:15px;height:15px;color:var(--ink)}
.gt .gbody{padding:10px 12px 12px}
.gt .gbody p{margin:0 0 8px;font-size:12.5px;color:var(--mt);line-height:1.45}
.gt .ac{display:flex;gap:8px;margin-top:10px}
.bt{flex:1;min-height:40px;border:1px solid var(--ln2);border-radius:10px;background:var(--s2);color:var(--ink);font:700 13px var(--f);cursor:pointer}
.bt.p{background:var(--ink);color:var(--s1);border-color:var(--ink)}
.bt:disabled{opacity:.55;cursor:default}
.gt.rs{border:1px dashed var(--mu);background:transparent}
.gt.rs header{background:var(--s2)}
.gt.rs .tm{opacity:.72}
.gt.gw{border-color:color-mix(in srgb,var(--t) 52%,var(--ln2));background:color-mix(in srgb,var(--soft) 55%,var(--s1))}
.gwait{display:flex;align-items:center;gap:9px;margin:0 0 9px;font-size:12.5px;color:var(--mt);line-height:1.45}
.gspin{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--t) 40%,var(--ln2));border-top-color:var(--ink);animation:gspin .8s linear infinite}
.gerr{margin:0 0 9px;padding:8px 10px;border-radius:9px;background:var(--dsoft);color:var(--er);font-size:12px;line-height:1.45}
@keyframes gspin{to{transform:rotate(360deg)}}

/* inspector */
.insp{display:none;min-height:0;overflow-y:auto;padding:22px 18px;background:var(--s2);border-left:1px solid var(--ln)}
@media (min-width:1280px){.insp{display:block}}
.insp h2{margin:0 0 10px;font-size:12px;font-weight:800;color:var(--mt)}
.insp .ih{margin-top:24px}
.instate{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid var(--ln);border-radius:12px;background:var(--s1)}
.idot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.instate b{display:block;font-size:13px;font-weight:700}
.instate small{display:block;margin-top:2px;color:var(--mt);font-size:12px;line-height:1.45}
.ilive{margin-left:auto;align-self:flex-start;font-style:normal;font-size:10.5px;font-weight:700;color:var(--er)}
.ilive.pv{color:var(--mu)}
.ipark{margin-top:10px;padding:12px 13px;border:1px solid color-mix(in srgb,var(--t) 42%,var(--ln));border-radius:12px;background:var(--soft)}
.ipark b{display:block;font-size:12px;font-weight:800}
.ipark code{display:block;margin-top:6px;padding:8px 9px;border-radius:7px;background:#1B1426;color:#F5F0FF;font:11px/1.5 var(--mono);overflow-wrap:anywhere}
.ipark small{display:block;margin-top:7px;color:var(--mt);font-size:11.5px}
.awayrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:12.5px;line-height:1.4}
.awayrow:last-child{border:0}
.awayrow>i{width:7px;height:7px;border-radius:2px;margin-top:5px;flex:none}
.awayrow small{display:block;color:var(--mt);font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums}
.iempty{margin:0;color:var(--mt);font-size:12px;line-height:1.5}

/* composer */
.cmpWrap{flex:none;padding:6px 20px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.cmp{width:100%;max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 15px;border:1px solid var(--ln2);border-radius:20px;background:var(--s1);transition:border-color .15s}
.cmp:focus-within{border-color:color-mix(in srgb,var(--ink) 38%,var(--ln2))}
.cmp textarea{flex:1;min-width:0;min-height:26px;max-height:160px;padding:7px 0;border:0;outline:0;background:none;resize:none;font-size:16px;line-height:1.4;overflow-y:auto}
.cmp textarea::placeholder{color:var(--mu)}
.snd{width:38px;height:38px;border-radius:50%;border:0;background:var(--t);color:var(--amb);display:grid;place-items:center;flex:none;transition:background .15s,transform .15s,color .15s}
.snd:hover:not(:disabled){transform:scale(1.04)}
.snd:disabled{background:var(--s3);color:var(--mu);cursor:default}
.snd.stop{background:var(--ink);color:var(--s1)}
.snd .ic{width:18px;height:18px}
.chint{max-width:720px;margin:6px auto 0;display:flex;justify-content:space-between;gap:12px;color:var(--mu);font-size:11px}
@media (max-width:899px){.chint{display:none}}
@media (max-width:560px){.cmpWrap{padding:4px 10px calc(8px + env(safe-area-inset-bottom))}.cmp{padding-left:13px}}

/* utility pages */
.pgw{display:none;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:26px 24px 48px;background:var(--bg)}
.pagewrap{width:100%;max-width:820px;margin:0 auto;animation:in .2s cubic-bezier(.22,1,.36,1) both}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}
.phead h1{margin:0;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.psub{margin:6px 0 0;max-width:62ch;color:var(--mt);font-size:13.5px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border:1px solid var(--ln2);border-radius:9px;background:var(--s2);color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--s1);border-color:var(--ink)}
.btn.p{background:var(--ink);border-color:var(--ink);color:var(--s1)}
.btn.d{background:var(--er);border-color:var(--er);color:var(--s1)}
.btn .ic{width:15px;height:15px}
.notice{margin:12px 0 0;padding:12px 14px;border:1px solid var(--ln);border-radius:11px;background:var(--s1);font-size:12.5px;line-height:1.5;color:var(--mt)}
.notice b{display:block;color:var(--ink);font-size:12.5px;margin-bottom:2px}
.notice.warn{border-color:color-mix(in srgb,var(--t) 46%,var(--ln));background:var(--soft);color:var(--ink)}
.notice .btn{margin-top:8px}
.block{margin-top:18px}
.blabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px;font-size:12px;font-weight:700;color:var(--mt)}
.panel{border:1px solid var(--ln);border-radius:13px;background:var(--s1);overflow:hidden}
.loading{display:flex;align-items:center;gap:9px;padding:18px;color:var(--mt);font-size:13px}
.loading i{width:6px;height:6px;border-radius:50%;background:var(--t);animation:pls 1s infinite}
.loading i:nth-child(2){animation-delay:.15s}.loading i:nth-child(3){animation-delay:.3s}

/* tasks */
.next{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:17px 19px;border:1px solid var(--ln);border-radius:14px;background:var(--s1);margin-bottom:18px}
.next .plabel{font-size:11.5px;font-weight:700;color:var(--mt)}
.next .ntitle{margin-top:4px;font-size:14px;font-weight:700}
.next .nsub{margin-top:2px;color:var(--mt);font-size:12px}
.next .ntime{font:400 27px/1 var(--mono);letter-spacing:-.03em;white-space:nowrap;font-variant-numeric:tabular-nums}
.task{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-bottom:1px solid var(--ln)}
.task:last-child{border-bottom:0}
.tico{width:33px;height:33px;border-radius:9px;background:var(--s2);color:var(--mt);display:grid;place-items:center;flex:none;border:1px solid var(--ln)}
.tico .ic{width:16px;height:16px}
.tinfo{flex:1;min-width:0}
.tinfo b{display:block;font-size:13.5px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.tinfo small{display:block;margin-top:2px;color:var(--mt);font-size:12px}
.tinfo small .mono{font-family:var(--mono);font-size:11.5px}
.spill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
.spill.pend{background:var(--s3);color:var(--mt)}
.spill.run{background:var(--soft);color:var(--ink)}
.spill.done{background:var(--osoft);color:var(--ok)}
.spill.fail{background:var(--dsoft);color:var(--er)}
.tpay{margin-top:6px}
.tpay summary{font-size:11.5px;font-weight:700;color:var(--mt);cursor:pointer;width:max-content}
.tpay p{margin:6px 0 0;padding:9px 11px;border-radius:8px;background:var(--s2);color:var(--mt);font-size:12px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.awayrow2{display:flex;align-items:baseline;gap:10px;padding:10px 15px;border-bottom:1px solid var(--ln);font-size:12.5px}
.awayrow2:last-child{border-bottom:0}
.awayrow2 .atime{margin-left:auto;color:var(--mu);font:11px var(--mono);white-space:nowrap}

/* files */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ln);border-radius:13px;background:var(--s1);overflow:hidden}
.stat{padding:14px 16px;border-right:1px solid var(--ln);min-width:0}
.stat:last-child{border-right:0}
.stat span{display:block;color:var(--mt);font-size:11.5px;font-weight:600}
.stat b{display:block;margin-top:3px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-size:11.5px;font-weight:600;color:var(--mt);margin-left:3px}
.ceiling{margin:8px 2px 0;color:var(--mu);font-size:11.5px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.filelist{margin-top:14px}
.frow{display:flex;align-items:center;gap:10px;min-height:50px;padding:7px 12px;border-bottom:1px solid var(--ln)}
.frow:last-child{border-bottom:0}
.fico{width:30px;height:30px;border-radius:8px;background:var(--s2);display:grid;place-items:center;color:var(--mt);flex:none}
.fico .ic{width:15px;height:15px}
.fname{flex:1;min-width:0}
.fname b{display:block;font:600 12.5px/1.4 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname small{display:block;font:11px/1.4 var(--mono);color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsize{flex:none;font:11.5px var(--mono);color:var(--mt);font-variant-numeric:tabular-nums}
.fdel{width:30px;height:30px;border:0;border-radius:7px;background:none;color:var(--mu);display:grid;place-items:center;flex:none;opacity:0;transition:opacity .15s,background .15s,color .15s}
.frow:hover .fdel,.fdel:focus-visible{opacity:1}
.fdel:hover{background:var(--dsoft);color:var(--er)}
.fdel .ic{width:15px;height:15px}
@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(3){grid-column:1/-1;border-top:1px solid var(--ln)}
  .fdel{opacity:1}
}

/* tools */
.capgroup{margin-top:20px}
.cap{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border:1px solid var(--ln);border-radius:11px;background:var(--s1);margin-bottom:7px}
.cap.off{background:transparent;border-style:dashed}
.cico{width:32px;height:32px;border-radius:9px;background:var(--s2);color:var(--mt);display:grid;place-items:center;flex:none;border:1px solid var(--ln)}
.cico .ic{width:15px;height:15px}
.cinfo{flex:1;min-width:0}
.cinfo b{display:block;font-size:13.5px;font-weight:700}
.cinfo p{margin:3px 0 0;color:var(--mt);font-size:12.5px;line-height:1.5}
.cstate{flex:none;margin-left:8px;padding-top:2px;font-size:10.5px;font-weight:700;color:var(--ok);white-space:nowrap}
.cap.off .cstate{color:var(--mu)}

/* dialog, toast */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:calc(100vw - 24px)}
dialog::backdrop{background:rgba(20,10,40,.52)}
.dlg{width:min(430px,calc(100vw - 24px));padding:20px;border:1px solid var(--ln);border-radius:17px;background:var(--s1);box-shadow:var(--sh2)}
.dlg h2{margin:0;font-size:18px;line-height:1.25;font-weight:800;letter-spacing:-.01em}
.dlg p{margin:7px 0 0;color:var(--mt);font-size:13px;line-height:1.5}
.dlg label.fl{display:block;margin:16px 0 0;font-size:12px;font-weight:700;color:var(--mt)}
.dlg input[type=text],.dlg input[type=password]{display:block;width:100%;height:40px;margin-top:6px;padding:0 11px;border:1px solid var(--ln2);border-radius:9px;background:var(--s2);outline:0;font-size:14px}
.dlg input:focus{border-color:var(--ink)}
.dlg .help{margin-top:7px;color:var(--mu);font-size:11.5px;line-height:1.5}
.dlg .err{margin-top:9px;padding:9px 11px;border:0}
.dlg .dacts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.chk{display:flex;align-items:flex-start;gap:8px;margin-top:14px;padding:10px 11px;border:1px solid var(--ln);border-radius:9px;background:var(--s2);font-size:12.5px;line-height:1.45;color:var(--ink)}
.chk input{margin:2px 0 0;flex:none;accent-color:var(--er)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;max-width:min(92vw,420px);padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--s1);font-size:12.5px;font-weight:600;line-height:1.4;box-shadow:var(--sh2);transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast:empty{display:none}
.away #mx *,.away .wdot,.away .sdot,.away .loading i{animation-play-state:paused!important}

@media (max-width:560px){
  .tcard .tch{display:grid;grid-template-columns:30px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:9px;row-gap:2px;align-items:center;min-height:52px;padding:7px 10px 7px 7px}
  .tcard .ti{grid-row:1/span 2;align-self:center}
  .tcard .tnm{grid-column:2;grid-row:1}
  .tcard .tst{grid-column:3;grid-row:1;justify-self:end}
  .tcard .tcm{grid-column:2/span 2;grid-row:2;max-width:100%}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .tcard .pg.ind i{width:100%;opacity:.35}
}

/* rig */
.shd{transform-box:fill-box;transform-origin:center;fill:rgba(0,0,0,.3);animation:var(--sk,none) var(--bd,4s) var(--sine) infinite}
.sq{transform-box:fill-box;transform-origin:50% 100%;animation:var(--bk,breathe) var(--bd,4s) var(--sine) infinite}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 3.6s var(--sine) infinite;transition:transform .8s cubic-bezier(.34,1.4,.64,1)}
[data-s=error] .ear,[data-s=sleep] .ear{animation:none;transform:rotate(calc(var(--ed)*22deg))}

let tsq1=0,tsq2=0;
function refreshSessionsSoon(){clearTimeout(tsq1);clearTimeout(tsq2);loadSessions();tsq1=setTimeout(loadSessions,2500);tsq2=setTimeout(loadSessions,7000)}
async function renameSession(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;const v=await askDialog({title:"Rename chat",label:"Name",value:dispTitle(s.title),placeholder:"A short name",confirm:"Rename"});if(!v)return;try{const r=await api("/api/sessions/"+encodeURIComponent(id),{method:"PATCH",headers:{"content-type":"application/json"},body:JSON.stringify({title:v})});const j=await r.json().catch(()=>({}));if(!j.ok){toast(j.error||"Could not rename this chat.");return}s.title=v;renderList();renderTitle()}catch(e){toast("Could not rename this chat.")}}
async function deleteSession(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;if(id===state.sessionId&&(busy||PENDING)){toast("Stop the turn or decide the approval first.");return}const hasBody=id===state.sessionId&&WS&&WS.saved;const r=await confirmDialog({title:"Delete this chat?",body:`"${dispTitle(s.title)}" and its transcript will be deleted.`+(hasBody?"":" Its saved files are kept."),check:hasBody?`Also delete its saved files (${WS.files} file${WS.files===1?"":"s"}, ${fmtB(WS.bytes)}). This cannot be undone.`:"",confirm:"Delete chat",danger:true});if(!r.ok)return;
try{const res=await api("/api/sessions/"+encodeURIComponent(id),{method:"DELETE",headers:{"content-type":"application/json"},body:JSON.stringify(r.checked?{confirm_body:true}:{})});const j=await res.json().catch(()=>({}));if(!j.ok){toast(j.error||"Could not delete this chat.");return}
if(r.checked&&j.workspace!=="deleted")toast("The chat is deleted. Its files are not.");
state.sessions=state.sessions.filter(x=>x.id!==id);
if(state.sessionId!==id){renderList();renderTitle();return}
teardown();clearLive();PENDING=null;busy=false;WS=null;MF=null;WSE="";
const next=state.sessions.find(x=>x.id==="main")||state.sessions[0];
if(next){await openSession(next.id);return}
state.sessionId=null;try{localStorage.removeItem("blip.session")}catch(e){}LOG=[];cur="idle";tab="chat";render();renderThread()}catch(e){toast("Could not delete this chat.")}}
function pick(id){if(busy&&id!==state.sessionId){toast("A turn is running. Stop it before switching chats.");return}if(PENDING&&id!==state.sessionId){toast("Approve or deny the command first.");return}openSession(id)}
function reloadChat(){if(state.sessionId)openSession(state.sessionId);else bootLoad()}

async function loadTasks(){if(!hasKey())return;try{const r=await api("/api/tasks");const j=await r.json();if(!j.ok){TASKSFAILED=true}else{TASKS=j.tasks||[];TASKSFAILED=false}updateTaskBadge();$("insp").innerHTML=insp();if(tab==="tasks")renderPage()}catch(e){TASKSFAILED=true;if(tab==="tasks")renderPage()}}
async function loadCaps(){if(!hasKey())return;try{const r=await api("/api/capabilities");const j=await r.json();if(!j.ok||!Array.isArray(j.capabilities)){CAPSFAILED=true;CAPS=[]}else{CAPS=j.capabilities;CAPSFAILED=false}if(tab==="tools")renderPage()}catch(e){CAPSFAILED=true;CAPS=[];if(tab==="tools")renderPage()}}
async function loadWs(){if(!hasKey()||!state.sessionId)return;const sid=state.sessionId;let p=null,m=null,pe="",me="";
try{const r=await api("/api/sessions/"+encodeURIComponent(sid)+"/workspace");const j=await r.json().catch(()=>({}));if(r.ok&&j.ok&&j.workspace)p=j.workspace;else pe="load"}catch(e){pe="load"}
if(state.sessionId!==sid)return;
if(p&&p.saved){try{const r=await api("/api/sessions/"+encodeURIComponent(sid)+"/workspace/files");if(r.status===404)m={files:[],truncated:false};else if(r.ok){const j=await r.json().catch(()=>null);if(j&&Array.isArray(j.files))m={files:j.files,truncated:!!j.truncated};else me="list"}else me="list"}catch(e){me="list"}}
else if(p)m={files:[],truncated:false};
WS=p;MF=m;WSE=pe||me;if(tab==="docs")renderPage()}
async function dlWs(){const sid=state.sessionId;if(!sid)return;try{const r=await api("/api/sessions/"+encodeURIComponent(sid)+"/workspace/archive");if(!r.ok){const j=await r.json().catch(()=>({}));toast(j.error||j.reason||("Could not download ("+r.status+")."));return}const u=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=u;a.download="workspace-"+sid+".tar.gz";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast("Could not download the workspace.")}}
async function delFileAt(i){const sid=state.sessionId;if(!sid||!MF||!MF.files[i])return;const p=String(MF.files[i].path);const r=await confirmDialog({title:"Delete this file?",body:`${p} will be removed from the saved workspace.`,confirm:"Delete file",danger:true});if(!r.ok)return;try{const tail=p.split("/").map(encodeURIComponent).join("/");const res=await api("/api/sessions/"+encodeURIComponent(sid)+"/workspace/files/"+tail,{method:"DELETE"});const j=await res.json().catch(()=>({}));if(!res.ok){toast(j.error||("Delete failed ("+res.status+")."));return}await loadWs();if(MF&&MF.files.some(f=>String(f.path)===p))MF={files:MF.files.filter(f=>String(f.path)!==p),truncated:!!MF.truncated};if(tab==="docs")renderPage()}catch(e){toast("Could not delete the file.")}}
async function decide(approve){if(!PENDING)return;const toolCallId=PENDING.toolCallId,cmd=PENDING.cmd,sid=state.sessionId;
const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
try{const r=await api("/api/approve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sessionId:sid,toolCallId,approved:approve}),signal:ctl.signal});
const j=await r.json().catch(()=>({}));
if(!r.ok||!j.ok){if(state.sessionId!==sid)return;gateError(j.error||("The agent could not record your decision ("+r.status+")."),approve,j.state!=="not_waiting");return}
PENDING=null;if(!approve)LOG.push(["g",{cmd}]);
if(j.state==="queued"&&j.streamId){if(state.sessionId!==sid)return;resolveGate(approve,cmd,approve?"Approved. Blip is continuing below.":"Denied. Blip is continuing below.");beginLive(sid);LIVE.operationId=j.operationId||null;saveLive();connectStream(j.streamId);announce(approve?"Approved. Watching the turn.":"Denied. Watching the turn.");return}
if(state.sessionId!==sid)return;
if(j.output!==undefined&&j.output!==null)LOG.push(["t",{name:"exec",cmd,output:j.output,ok:j.ok}]);if(j.reply)LOG.push(["a",String(j.reply),Date.now()]);
PREVIEW=false;teardown();clearLive();busy=false;cur=(j.state&&S[j.state])?j.state:(approve?"success":"idle");renderThread();upd();scrollEnd(true);announce(approve?"Approved.":"Denied.");loadTasks();refreshSessionsSoon()
}catch(e){if(state.sessionId!==sid)return;const slow=e&&e.name==="AbortError";gateError(slow?"The agent did not answer in time. Reload this chat to see where the turn got to.":"Could not send the decision. "+e,approve,!slow)}
finally{clearTimeout(to);DECIDING=false;setSend()}}
async function loadPending(id){if(!hasKey())return;try{const r=await api("/api/sessions/"+encodeURIComponent(id)+"/approval");const j=await r.json().catch(()=>({}));if(state.sessionId!==id||LIVE||!j.ok||!j.pending)return;beginLive(id);busy=false;mountGate({toolCallId:j.pending.toolCallId,cmd:j.pending.cmd,name:j.pending.name||"exec"});setSend()}catch(e){}}

function pTasks(){const open=TASKS.filter(t=>t.status!=="done"),done=TASKS.filter(t=>t.status==="done").slice(-4).reverse();const pending=open.filter(t=>t.status==="pending"&&t.due_at).sort((a,b)=>Number(a.due_at)-Number(b.due_at));const next=pending[0];const daily=pending.filter(t=>t.recurrence).length;
const head=`<div class="phead"><div><h1>Tasks</h1><p class="psub">${open.length?`${open.length} open${daily?` · ${daily} daily`:""}`:"Nothing is scheduled. Ask Blip to run something on a schedule."}</p></div>${hasKey()?`<button class="btn" onclick="suggest(SUGS[3].prompt)">${ic("plus")}New schedule</button>`:""}</div>`;
const lead=next?`<div class="next"><div><div class="plabel">Next scheduled</div><div class="ntitle">${esc(next.title)}</div><div class="nsub">${esc(recurrenceText(next.recurrence)||"One-off")} · ${esc(fmtDue(next.due_at))}</div></div><div class="ntime">${esc(countdown(next.due_at))}</div></div>`:"";
const notice=TASKSFAILED?'<div class="notice warn"><b>Could not refresh tasks</b>Showing the last list. <button class="btn" onclick="loadTasks()">Retry</button></div>':"";
const rows=open.map(t=>{const st=t.status==="running"?"run":t.status==="failed"?"fail":"pend";const label=t.status==="running"?"Running":t.status==="failed"?"Failed":"Scheduled";const rec=recurrenceText(t.recurrence);const when=t.status==="running"?"Running now":(rec?rec+" · next "+fmtDue(t.due_at):(t.due_at?fmtDue(t.due_at):"No due time"));const payload=String(t.payload||"").trim();return `<div class="task"><span class="tico">${ic("task")}</span><div class="tinfo"><b>${esc(t.title)}</b><small>${esc(when)}</small>${payload&&payload!==t.title?`<details class="tpay"><summary>Instructions</summary><p>${esc(payload)}</p></details>`:""}</div><span class="spill ${st}">${label}</span></div>`}).join("");
let body="";if(!hasKey())body=`<div class="emptybox">${ic("key")}<h2>Connect your agent</h2><p>Tasks come from the agent. Add the key first.</p><button class="btn p" onclick="openKeyDialog()">Connect</button></div>`;else if(!open.length&&!done.length&&!TASKSFAILED)body=`<div class="emptybox">${ic("task")}<h2>Nothing scheduled</h2><p>Ask Blip to check something every morning, or run a job once at a set time.</p><button class="btn" onclick="suggest(SUGS[3].prompt)">Try a morning brief</button></div>`;else if(open.length)body=`<div class="panel">${rows}</div>`;
const away=done.length?`<div class="block"><div class="blabel"><span>While you were away</span></div><div class="panel">${done.map(t=>`<div class="awayrow2"><span>${esc(t.title)}</span><span class="atime">${esc(fmtShort(t.due_at||t.created_at))}</span></div>`).join("")}</div></div>`:"";
return head+notice+lead+body+away}

function pFiles(){const head=`<div class="phead"><div><h1>Files</h1><p class="psub">This chat's workspace. Files stay until you delete them.</p></div>${WS&&WS.saved?`<div class="facts"><button class="btn" onclick="dlWs()">${ic("download")}Download all</button><button class="btn" onclick="loadWs()">${ic("reload")}Refresh</button></div>`:""}</div>`;
if(!hasKey())return head+`<div class="emptybox">${ic("key")}<h2>Connect your agent</h2><p>Workspace files come from the agent. Add the key first.</p><button class="btn p" onclick="openKeyDialog()">Connect</button></div>`;
if(!state.sessionId)return head+`<div class="emptybox">${ic("doc")}<h2>No chat open</h2><p>Open a chat and its saved files appear here.</p><button class="btn" onclick="go('chat')">Open chat</button></div>`;
if(WSE==="load")return head+`<div class="emptybox">${ic("alert")}<h2>Could not read the workspace</h2><p>Try again in a moment.</p><button class="btn" onclick="loadWs()">Retry</button></div>`;
if(!WS)return head+loadingHTML("Reading this chat's workspace");
const stats=WS.saved?`<div class="stats"><div class="stat"><span>Files</span><b>${Number(WS.files)||0}</b></div><div class="stat"><span>Size</span><b>${fmtB(WS.bytes)}</b></div><div class="stat"><span>Last saved</span><b>${WS.updatedAt?esc(rel(WS.updatedAt)):"unknown"}</b></div></div><div class="ceiling">Ceiling ${fmtB(WS.limit||25165824)} compressed. node_modules is excluded.</div>`:"";
const warn=WS.overLimit?`<div class="notice warn"><b>Too big to save</b>The last attempt measured ${fmtB(WS.overLimit)} against the ${fmtB(WS.limit||25165824)} ceiling, so nothing new was stored. Delete what you do not need, then ask again.</div>`:"";
const note=WSE==="list"?`<div class="notice"><b>Could not read the file list</b>The numbers above are still what was last saved. <button class="btn" onclick="loadWs()">Retry</button></div>`:"";
const lag=WS.saved&&MF&&!MF.truncated&&MF.files.length!=WS.files?`<div class="notice"><b>The list has not caught up</b>The manifest in KV can lag a write by up to a minute. <button class="btn" onclick="loadWs()">Refresh</button></div>`:"";
if(!WS.saved)return head+`<div class="emptybox">${ic("doc")}<h2>Nothing saved yet</h2><p>Ask Blip to build something. The workspace lands here and stays after the chat closes.</p><button class="btn" onclick="suggest('Build a small notes app and save it to this workspace.')">Start a build</button><button class="btn" onclick="loadWs()">${ic("reload")}Refresh</button></div>`+warn;
const list=MF===null?loadingHTML("Reading the file list"):!MF.files.length?`<div class="emptybox"><h2>No files in the saved snapshot</h2><p>The summary above comes from the chat's pointer row. Refresh in a moment.</p><button class="btn" onclick="loadWs()">Refresh</button></div>`:`<div class="filelist panel">${MF.files.map((f,i)=>{const p=String(f.path),cut=p.lastIndexOf("/"),name=cut<0?p:p.slice(cut+1),dir=cut<0?"":p.slice(0,cut);return `<div class="frow"><span class="fico">${ic("doc")}</span><div class="fname"><b>${esc(name)}</b><small>${esc(dir||"workspace")}</small></div><span class="fsize">${fmtB(f.bytes||0)}</span><button class="fdel" aria-label="Delete ${esc(p)}" onclick="delFileAt(${i})">${ic("trash")}</button></div>`}).join("")}</div>`+(MF.truncated?`<div class="notice">The list stops at ${MF.files.length} files. The rest are in the download.</div>`:"");
return head+stats+warn+list+note+lag}

function pTools(){const wired=CAPS.filter(c=>c.wired),off=CAPS.filter(c=>!c.wired);const head=`<div class="phead"><div><h1>Tools</h1><p class="psub">${CAPS.length?`${wired.length} connected · ${off.length} not connected`:"What this agent can actually do."}</p></div></div>`;
if(!hasKey())return head+`<div class="emptybox">${ic("key")}<h2>Connect your agent</h2><p>The tool list comes from the agent itself. Add the key first.</p><button class="btn p" onclick="openKeyDialog()">Connect</button></div>`;
if(!CAPS.length)return head+(CAPSFAILED?`<div class="emptybox">${ic("alert")}<h2>Could not load the tool list</h2><p>Check the key and the connection, then try again.</p><button class="btn" onclick="loadCaps()">Retry</button></div>`:loadingHTML("Reading the capability table"));
const V={memory:["idea","think"],shell:["code","code"],"web-search":["search","search"],scheduling:["task","think"],snapshots:["doc","files"],"sub-agents":["chat","think"],browser:["web","browse"],email:["mail","mail"],payments:["pay","pay"],mcp:["tools","idle"]};
const capRow=c=>{const v=V[c.id]||["tools","idle"];return `<div class="cap${c.wired?"":" off"}"><span class="cico">${ic(v[0])}</span><div class="cinfo"><b>${esc(c.label)}</b><p>${esc(c.detail)}</p></div><span class="cstate">${c.wired?"Connected":"Not connected"}</span></div>`};
let body="";if(wired.length)body+=`<div class="capgroup"><div class="blabel"><span>Available now</span><span>${wired.length}</span></div>${wired.map(capRow).join("")}</div>`;if(off.length)body+=`<div class="capgroup"><div class="blabel"><span>Not connected</span><span>${off.length}</span></div>${off.map(capRow).join("")}</div>`;
return head+body}

async function bootLoad(){try{const th=localStorage.getItem("blip.theme");if(th==="dark"||th==="light")D.dataset.theme=th}catch(e){}
syncTheme();if(!hasKey()){SESSLOAD=false;SESSFAILED=false;renderThread();render();return}
SESSLOAD=true;SESSFAILED=false;renderThread();render();await loadSessions();SESSLOAD=false;loadTasks();loadCaps();
const ids=state.sessions.map(s=>s.id);let stored=null;try{stored=localStorage.getItem("blip.session")}catch(e){}
const id=(stored&&ids.includes(stored))?stored:(ids.includes("main")?"main":ids[0]);
if(id)await openSession(id);else{state.sessionId=null;try{localStorage.removeItem("blip.session")}catch(e){}LOG=[];renderThread();render()}}

document.addEventListener("visibilitychange",()=>{D.classList.toggle("away",document.hidden)});
addEventListener("keydown",e=>{if(e.key==="Escape"){const d=$("dlg");if(d&&d.open)return;if($("app").classList.contains("dr"))side(0)}});
matchMedia("(max-width:899px)").addEventListener("change",e=>{if(!e.matches)side(0)});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{syncTheme()});
const dd=document.createElement("div");dd.innerHTML=MXSVG;MXE=dd.firstElementChild;$("avc").appendChild(MXE);
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!busy&&!PENDING)send()}});
$("inp").addEventListener("input",()=>{sizeInp();setSend()});
let pq=0;addEventListener("pointermove",e=>{if(pq)return;pq=requestAnimationFrame(()=>{pq=0;const r=MXE.getBoundingClientRect(),c=(v,a,b)=>Math.max(-1,Math.min(1,(v-a)/b*2));MXE.style.setProperty("--px",c(e.clientX,r.left+r.width/2,innerWidth)*2.6+"px");MXE.style.setProperty("--py",c(e.clientY,r.top+r.height/2,innerHeight)*2.2+"px")})});
addEventListener("pagehide",()=>{const L=LIVE;if(L&&L.es){L.es.onerror=null;L.es.onmessage=null;L.es.close()}});
setInterval(tick,1000);setInterval(()=>{vi++;tick()},2400);
setInterval(()=>{if(cur!=="idle"||tab!=="chat"||busy||document.hidden)return;const x=["wink","twitch","hip"][Math.random()*3|0];MXE.classList.add(x);setTimeout(()=>MXE.classList.remove(x),1000)},5200);
sizeInp();setSend();render();bootLoad();

</script>
